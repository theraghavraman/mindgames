<!doctype html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Games: Sudoku variants, logic puzzles and brain games</title>
<meta name="description" content="A free workbook of 54 mind games in one place: sixteen Sudoku variants, Kakuro, Futoshiki, logic grids, duels against the computer and brain training. Pick a game and play instantly.">
<meta name="theme-color" content="#EEF1F5">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/recursive-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/mg.css">
<link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>
<script src="assets/js/mg.js"></script>
<div class="shell">
  <aside class="side" aria-label="All games">
    <div class="side-top">
      <a class="brand" href="./" data-home aria-label="Mind Games, all games"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="wordmark">Mind Games</span></a>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme" title="Switch theme"><svg class="i" aria-hidden="true"><use data-theme-icon href="#i-moon"/></svg></button>
    </div>
    <label class="search"><span class="sr-only">Find a game</span><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input type="search" data-q placeholder="Find a game" autocomplete="off"><kbd>/</kbd></label>
    <nav class="side-list" id="sideList" aria-label="Games by chapter"></nav>
    <div class="side-foot"><button type="button" class="btn btn-quiet btn-sm" data-random><svg class="i" aria-hidden="true"><use href="#i-dice"/></svg>Random game</button></div>
  </aside>
  <main class="pane">
    <div class="hub lib" id="lib">
      <header class="hub-top">
        <a class="brand" href="./" data-home aria-label="Mind Games, all games"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="wordmark">Mind Games</span></a>
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
          <label class="search"><span class="sr-only">Find a game</span><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input type="search" data-q placeholder="Find a game" autocomplete="off"><kbd>/</kbd></label>
          <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme" title="Switch theme"><svg class="i" aria-hidden="true"><use data-theme-icon href="#i-moon"/></svg></button>
        </div>
      </header>
      <section class="hero" aria-labelledby="heroTitle">
        <div>
          <h1 id="heroTitle">Puzzles for a sharp pencil.</h1>
          <p class="hero-sub" id="heroSub"></p>
          <div class="hero-cta">
            <button type="button" class="btn btn-primary" data-random><svg class="i" aria-hidden="true"><use href="#i-dice"/></svg>Play a random game</button>
            <a class="btn btn-quiet" id="btnContinue" hidden href="#"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span>Continue</span></a>
          </div>
        </div>
        <figure class="demo" data-chapter="sudoku" style="margin:0">
          <div class="demo-board" id="demoBoard" aria-hidden="true"></div>
          <figcaption class="demo-cap"><span>A 6×6 Sudoku solving itself, easiest cell first.</span><a href="games/mini-sudoku/index.html" data-open="mini-sudoku">Play it</a></figcaption>
        </figure>
      </section>
      <div class="recent" id="recent" hidden></div>
      <nav class="chips" id="chips" aria-label="Chapters"></nav>
      <div id="library"></div>
      <footer class="hub-foot">
        <p>Everything runs in your browser. Progress, settings and statistics stay on this device; nothing is sent anywhere.</p>
        <p>Set in Recursive, under the SIL Open Font License.</p>
      </footer>
    </div>
    <section class="stage-frame" id="stage" hidden aria-label="Game">
      <div class="frames" id="frames"></div>
      <div class="frame-busy" id="frameBusy" hidden><div class="loader" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="ov-text">Opening the game.</p></div>
    </section>
  </main>
</div>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/thumbs.js"></script>
<script src="assets/js/latin-core.js"></script>
<script src="assets/js/hub.js"></script>
</body>
</html>
