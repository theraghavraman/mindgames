/* ==========================================================================
   Mind Games — shared styles
   Graph paper, graphite print, pen-blue handwriting, highlighter selection,
   red pen for mistakes, green for hints. Every chapter has its own highlighter.
   ========================================================================== */


:root {
  color-scheme: light;
  --paper: #EEF1F5;
  --grid-minor: rgba(46, 78, 128, .055);
  --grid-major: rgba(46, 78, 128, .10);
  --sheet: #FFFFFF;
  --sheet-2: #F5F7FA;
  --tint: rgba(35, 38, 46, .06);
  --graphite: #23262E;
  --graphite-2: #545B69;
  --pencil: #7D8494;
  --rule: #D6DCE5;
  --frame: #23262E;
  --pen: #2340B8;
  --pen-soft: #E3E8FA;
  --on-pen: #FFFFFF;
  --hl: #FFE15A;
  --hl-soft: #FFF1A6;
  --hl-ring: #E2B600;
  --hl-ink: #23262E;
  --peer: #EDF1F7;
  --red: #D21F3C;
  --red-soft: #FDE6EA;
  --green: #0E8F63;
  --green-soft: #DCF3E9;
  --on-green: #FFFFFF;
  --veil: rgba(255, 255, 255, .78);
  --shadow-pop: 0 30px 80px -30px rgba(20, 30, 50, .45), 0 2px 8px rgba(20, 30, 50, .08);

  /* Chapter highlighters (light) */
  --c-sudoku: #FFE15A;  --c-sudoku-soft: #FFF1A6;  --c-sudoku-deep: #C99A00;
  --c-logic: #FFA9D7;   --c-logic-soft: #FFDDEF;   --c-logic-deep: #D4377F;
  --c-numbers: #FFC07A; --c-numbers-soft: #FFE4C4; --c-numbers-deep: #D86F00;
  --c-moves: #C3EE7C;   --c-moves-soft: #E7F8CB;   --c-moves-deep: #5E9A0E;
  --c-duels: #92DBFF;   --c-duels-soft: #D5F0FF;   --c-duels-deep: #1580C2;
  --c-brain: #CDBDFF;   --c-brain-soft: #EAE3FF;   --c-brain-deep: #6A4BE0;

  --ch: var(--c-sudoku); --ch-soft: var(--c-sudoku-soft); --ch-deep: var(--c-sudoku-deep);

  --font: 'Recursive', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --casual: 'CASL' 1;

  /* Board sizing. Games set --ar (width / height), --chrome and --max-bw. */
  --vh: 100vh;
  --ar: 1;
  --chrome: 330px;
  --max-bw: 620px;
  --min-bw: 232px;
  --safe-y: calc(env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
  --avail-w: calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  --avail-h: calc(var(--vh) - var(--chrome) - var(--safe-y));
  --bw: max(var(--min-bw), min(var(--avail-w), calc(var(--avail-h) * var(--ar)), var(--max-bw)));
  --bh: calc(var(--bw) / var(--ar));
  --panel: max(var(--bw), min(var(--avail-w), 420px));
}
@supports (height: 100dvh) { :root { --vh: 100dvh; } }

[data-chapter="sudoku"]  { --ch: var(--c-sudoku);  --ch-soft: var(--c-sudoku-soft);  --ch-deep: var(--c-sudoku-deep); }
[data-chapter="logic"]   { --ch: var(--c-logic);   --ch-soft: var(--c-logic-soft);   --ch-deep: var(--c-logic-deep); }
[data-chapter="numbers"] { --ch: var(--c-numbers); --ch-soft: var(--c-numbers-soft); --ch-deep: var(--c-numbers-deep); }
[data-chapter="moves"]   { --ch: var(--c-moves);   --ch-soft: var(--c-moves-soft);   --ch-deep: var(--c-moves-deep); }
[data-chapter="duels"]   { --ch: var(--c-duels);   --ch-soft: var(--c-duels-soft);   --ch-deep: var(--c-duels-deep); }
[data-chapter="brain"]   { --ch: var(--c-brain);   --ch-soft: var(--c-brain-soft);   --ch-deep: var(--c-brain-deep); }
/* Inside a game the chapter highlighter is the selection colour */
.app[data-chapter] { --hl: var(--ch); --hl-soft: var(--ch-soft); --hl-ring: var(--ch-deep); }

    --c-logic: #4D2440;   --c-logic-soft: #3A1D31;   --c-logic-deep: #FF8CC8;
    --c-numbers: #4D3418; --c-numbers-soft: #3B2A17; --c-numbers-deep: #FFB25C;
    --c-moves: #2F4519;   --c-moves-soft: #253517;   --c-moves-deep: #B4E66A;
    --c-duels: #183E52;   --c-duels-soft: #15303F;   --c-duels-deep: #7CCFFF;
    --c-brain: #33285A;   --c-brain-soft: #282145;   --c-brain-deep: #B8A6FF;
  }
}

  --c-logic: #4D2440;   --c-logic-soft: #3A1D31;   --c-logic-deep: #FF8CC8;
  --c-numbers: #4D3418; --c-numbers-soft: #3B2A17; --c-numbers-deep: #FFB25C;
  --c-moves: #2F4519;   --c-moves-soft: #253517;   --c-moves-deep: #B4E66A;
  --c-duels: #183E52;   --c-duels-soft: #15303F;   --c-duels-deep: #7CCFFF;
  --c-brain: #33285A;   --c-brain-soft: #282145;   --c-brain-deep: #B8A6FF;

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: var(--vh);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  color: var(--graphite); background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid-minor) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
  background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px;
  background-position: -1px -1px; background-attachment: fixed;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button, input, select { font-family: inherit; color: inherit; }
a { color: var(--pen); }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.i { width: 20px; height: 20px; flex: none; display: block; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 30px; height: 30px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.casual { font-variation-settings: var(--casual); }

.app {
  min-height: 100vh; min-height: var(--vh); max-width: 1180px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(env(safe-area-inset-right, 0px) + 12px)
           calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 12px);
}

/* ==========================================================================
   Top bar
   ========================================================================== */
.topbar { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
.brand a { text-decoration: none; color: inherit; }
.mark {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; flex: none;
  width: 28px; height: 28px; padding: 4px; border-radius: 8px; background: var(--graphite);
}
.mark i { border-radius: 1.5px; background: var(--paper); }
.mark i:nth-child(5) { background: var(--ch-deep, var(--hl-ring)); }
.wordmark {
  margin: 0; min-width: 0; font-size: 21px; line-height: 1.1; font-weight: 850; letter-spacing: -.015em;
  font-variation-settings: var(--casual); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wordmark .hl-word { background: linear-gradient(transparent 52%, var(--ch) 52% 92%, transparent 92%); padding: 0 2px; }
.actions { display: flex; align-items: center; gap: 2px; flex: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; flex: none;
  border: 0; border-radius: 11px; background: transparent; color: var(--graphite-2); cursor: pointer;
  text-decoration: none; transition: background-color .15s, color .15s;
}
.icon-btn:hover { background: var(--tint); color: var(--graphite); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.icon-btn.back { margin-left: -8px; color: var(--graphite); }
.btn-new {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; margin-right: 6px; padding: 0 14px 0 10px;
  border: 0; border-radius: 11px; background: var(--graphite); color: var(--paper);
  font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .08s; white-space: nowrap;
}
.btn-new:active { transform: translateY(1px); }

/* ==========================================================================
   Stage, status bar, board
   ========================================================================== */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.board-frame { display: grid; grid-template-columns: var(--bw); grid-template-rows: auto var(--bh); }
.statusbar { height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.level {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; margin-left: -8px; padding: 0 8px; min-width: 0;
  border: 0; border-radius: 10px; background: none; color: var(--graphite);
  font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.level:hover { background: var(--tint); }
.level .i { width: 16px; height: 16px; color: var(--pencil); }
.level span:not(.meter) { overflow: hidden; text-overflow: ellipsis; }
.meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.meter i { width: 4px; border-radius: 1px; background: var(--rule); }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 8px; }
.meter i:nth-child(3) { height: 11px; } .meter i:nth-child(4) { height: 14px; }
.meter[data-rank="1"] i:nth-child(-n+1), .meter[data-rank="2"] i:nth-child(-n+2),
.meter[data-rank="3"] i:nth-child(-n+3), .meter[data-rank="4"] i { background: var(--graphite); }
.status-mid { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; font-weight: 650; color: var(--graphite-2); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pill b { color: var(--graphite); font-weight: 750; }

.hearts { display: flex; align-items: center; gap: 5px; }
.heart { width: 22px; height: 22px; overflow: visible; }
.heart .h-fill { fill: var(--red); stroke: var(--red); stroke-width: 1.5; stroke-linejoin: round; transition: fill .3s, stroke .3s; }
.heart .h-strike { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .35s .12s ease-out; }
.heart.lost .h-fill { fill: transparent; stroke: var(--pencil); }
.heart.lost .h-strike { stroke-dashoffset: 0; }
.heart.breaking { animation: heart-hit .55s ease-out; }
@keyframes heart-hit { 30% { transform: scale(1.35) rotate(-10deg); } 65% { transform: scale(.9) rotate(5deg); } }
.hearts.off { display: none; }

.clock { display: inline-flex; align-items: center; gap: 2px; margin-right: -8px; color: var(--graphite-2); font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.clock .icon-btn { width: 36px; height: 36px; }
.clock .i { width: 16px; height: 16px; }
.clock.no-time #clock { display: none; }

.board-wrap { position: relative; width: var(--bw); height: var(--bh); }
.board-host { position: relative; width: 100%; height: 100%; container-type: inline-size; user-select: none; -webkit-user-select: none; transition: filter .2s; }

/* Overlays: paused and building */
.overlay {
  position: absolute; inset: 0; z-index: 20; border-radius: 10px;
  display: grid; place-content: center; justify-items: center; gap: 12px; padding: 20px; text-align: center;
  background: var(--veil); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
}
.is-paused .ov-pause, .is-busy .ov-busy { opacity: 1; visibility: visible; }
.is-paused .board-host, .is-busy .board-host { filter: blur(4px); }
.is-paused .board-host *, .is-busy .board-host * { pointer-events: none; }
.ov-pause { cursor: pointer; }
.ov-title { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.1; font-variation-settings: var(--casual); }
.ov-text { margin: 0; max-width: 30ch; color: var(--graphite-2); font-size: 14px; }
.loader { display: grid; grid-template-columns: repeat(3, 14px); gap: 3px; padding: 4px; border-radius: 6px; background: var(--frame); }
.loader i { width: 14px; height: 14px; border-radius: 2px; background: var(--sheet); animation: load 1.35s ease-in-out infinite; }
.loader i:nth-child(2) { animation-delay: .15s; } .loader i:nth-child(3) { animation-delay: .3s; }
.loader i:nth-child(6) { animation-delay: .45s; } .loader i:nth-child(5) { animation-delay: .6s; }
.loader i:nth-child(4) { animation-delay: .75s; } .loader i:nth-child(7) { animation-delay: .9s; }
.loader i:nth-child(8) { animation-delay: 1.05s; } .loader i:nth-child(9) { animation-delay: 1.2s; }
@keyframes load { 0%, 100% { background: var(--sheet); } 15%, 40% { background: var(--ch-deep, var(--hl-ring)); } }

/* ==========================================================================
   Paper cells (shared by grid games)
   ========================================================================== */
.cell {
  position: relative; display: grid; place-items: center;
  min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; border-radius: 0;
  background: var(--sheet); color: var(--graphite);
  cursor: pointer; outline: none; -webkit-appearance: none; appearance: none;
  transition: background-color .12s;
}
.cell .v { position: relative; z-index: 2; line-height: 1; font-weight: 560; font-variant-numeric: lining-nums tabular-nums; }
.cell.user .v, .cell.wrong .v, .cell.hinted .v, .cell.revealed .v { font-weight: 640; font-variation-settings: var(--casual); }
.cell.user .v { color: var(--pen); }
.cell.hinted .v { color: var(--green); }
.cell.wrong .v { color: var(--red); }
.cell.revealed .v { color: var(--pencil); font-weight: 480; }
.cell.peer { background: var(--peer); }
.cell.zone { background: var(--green-soft); }
.cell.wrong { background: var(--red-soft); }
.cell.selected { background: var(--hl); }
.cell.selected.wrong { background: var(--red-soft); }
.cell.selected::before { content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; box-shadow: inset 0 0 0 2px var(--hl-ring); }
.cell.same .v::before {
  content: ""; position: absolute; z-index: -1; left: -30%; right: -30%; top: 14%; bottom: 2%;
  background: var(--hl-soft); border-radius: 2px 7px 3px 8px; transform: rotate(-4deg);
}
.cell.clash::after, .cell.target::after {
  content: ""; position: absolute; inset: 9%; z-index: 6; pointer-events: none; border: 2px solid var(--red); border-radius: 50%;
}
.cell.target::after { border-color: var(--green); animation: ring-in .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes ring-in { from { opacity: 0; transform: scale(1.6) rotate(-25deg); } to { opacity: 1; transform: none; } }
@media (hover: hover) { .cell:not(.selected):not(.wrong):hover { background: var(--sheet-2); } }

/* Effects */
.fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: var(--hl); opacity: 0; transform-origin: left center; }
.fx.sweep { animation: sweep .95s cubic-bezier(.3, .7, .2, 1) var(--d, 0ms) both; }
@keyframes sweep { 0% { opacity: .9; transform: scaleX(0); } 35% { opacity: .9; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(1); } }
.ink { animation: ink .22s ease-out; }
@keyframes ink { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: none; } }
.shake { animation: shake .4s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-4px) rotate(-4deg); } 40% { transform: translateX(4px) rotate(3deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.nudge { animation: nudge .26s; }
@keyframes nudge { 50% { transform: scale(.86); } }
.enter { animation: enter .5s cubic-bezier(.2, .8, .2, 1) var(--d, 0ms) both; }
@keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.pop { animation: pop .3s cubic-bezier(.2, .8, .2, 1.4); }
@keyframes pop { from { transform: scale(.5); opacity: .2; } to { transform: none; opacity: 1; } }
.flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--ch-deep); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* ==========================================================================
   Controls
   ========================================================================== */
.controls { width: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.coach { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 10px; align-items: start; min-height: 52px; }
.coach-i { width: 22px; height: 22px; margin-top: 1px; color: var(--pencil); }
.coach-title { margin: 0; font-size: 14px; font-weight: 750; line-height: 1.3; color: var(--graphite); }
.coach-text { margin: 1px 0 0; font-size: 13px; line-height: 1.38; color: var(--graphite-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.coach-body { min-width: 0; }
.coach[data-kind="hint"] .coach-i, .coach[data-kind="hint"] .coach-title,
.coach[data-kind="good"] .coach-i, .coach[data-kind="good"] .coach-title { color: var(--green); }
.coach[data-kind="mistake"] .coach-i, .coach[data-kind="mistake"] .coach-title,
.coach[data-kind="lost"] .coach-i, .coach[data-kind="lost"] .coach-title { color: var(--red); }

.hub-foot { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--graphite-2); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; }
.hub-foot p { margin: 0; max-width: 70ch; }

/* thumbnails */
.t-thin { fill: none; stroke: var(--rule); stroke-width: 1; }
.t-ink { fill: none; stroke: var(--graphite); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.t-mid { fill: none; stroke: var(--graphite-2); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.t-dash { fill: none; stroke: var(--graphite-2); stroke-width: 1.1; stroke-dasharray: 3 2; }
.t-hl { fill: var(--ch); }
.t-deep { fill: none; stroke: var(--ch-deep); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.t-fill { fill: var(--graphite); }
.t-sheet { fill: var(--sheet); }
.t-gray { fill: var(--graphite); opacity: .14; }
.t-red { fill: var(--red); }
.t-pen { fill: var(--pen); font-family: var(--font); font-weight: 640; font-variation-settings: var(--casual); }
.t-txt { fill: var(--graphite); font-family: var(--font); font-weight: 600; }
.t-small { fill: var(--graphite); font-family: var(--font); font-weight: 760; }
.tile:hover .t-hl { animation: thumb-glow 1.2s ease-in-out infinite alternate; }
@keyframes thumb-glow { to { fill: var(--ch-deep); opacity: .55; } }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .demo { width: min(100%, 300px); order: -1; }
  .hub-top .wordmark { font-size: 20px; }
  .search kbd { display: none; }
}
@media (max-width: 420px) { .hub-top .mark { display: none; } .search { flex-basis: 170px; } }

/* ==========================================================================
   One-page launcher: sidebar with every game, games open in place
   ========================================================================== */
.shell { min-height: 100vh; min-height: var(--vh); }
.side { display: none; }
.stage-frame { position: fixed; inset: 0; z-index: 40; background: var(--paper); }
.frames, .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
.frames iframe { display: block; border: 0; background: var(--paper); }
.frames iframe[hidden] { display: none; }
.frame-busy { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 12px; background: var(--paper); }
body.in-game { overflow: hidden; }
.side-empty { margin: 16px 12px; color: var(--graphite-2); font-size: 13.5px; }
@media (min-width: 1100px) {
  .shell { display: grid; grid-template-columns: 284px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; height: var(--vh); border-right: 1px solid var(--rule); background: color-mix(in srgb, var(--sheet) 72%, transparent); }
  .side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 12px 8px 18px; }
  .side-top .brand { gap: 10px; color: var(--graphite); text-decoration: none; }
  .side-top .wordmark { font-size: 20px; }
  .side .search { flex: none; margin: 4px 14px 10px; }
  .side-list { flex: 1; overflow-y: auto; padding: 0 8px 18px; overscroll-behavior: contain; scrollbar-width: thin; }
  .side-h { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; margin: 0; padding: 12px 10px 5px; background: color-mix(in srgb, var(--sheet) 92%, var(--paper)); font-size: 12.5px; font-weight: 800; color: var(--graphite-2); }
  .side-h::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--ch-deep); }
  .side-h small { margin-left: auto; color: var(--pencil); font-weight: 700; }
  .side-g { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 10px; border-radius: 9px; color: var(--graphite); text-decoration: none; font-size: 14px; font-weight: 640; }
  .side-g span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-g:hover { background: var(--tint); }
  .side-g[aria-current="page"] { background: var(--ch); font-weight: 780; }
  .side-g small { margin-left: auto; flex: none; font-size: 11.5px; color: var(--pencil); font-weight: 650; font-variant-numeric: tabular-nums; }
  .side-g[aria-current="page"] small { color: var(--graphite-2); }
  .side-foot { display: flex; gap: 8px; padding: 10px 14px 16px; border-top: 1px solid var(--rule); }
  .side-foot .btn { flex: 1; }
  .pane { position: relative; min-width: 0; }
  .pane .hub-top { display: none; }
  .pane .hub { padding-top: 10px; }
  .stage-frame { position: sticky; top: 0; height: 100vh; height: var(--vh); z-index: 1; }
  body.in-game { overflow: auto; }
  .in-game .lib { display: none; }
}

<body>
<script>
/* =============================================================================
   Mind Games core
   Shared helpers and the page shell every game is built on: top bar, levels,
   clock, pause, coach line, rules, settings, statistics and the end sheet.
   ============================================================================= */
(function () {
'use strict';
const MG = window.MG = window.MG || {};

/* ---------------------------------------------------------------- helpers */
MG.root = document.documentElement.getAttribute('data-root') || '';
MG.$ = id => document.getElementById(id);
MG.qs = (s, r = document) => r.querySelector(s);
MG.qsa = (s, r = document) => Array.from(r.querySelectorAll(s));
MG.range = n => Array.from({ length: n }, (_, i) => i);
MG.rand = n => Math.floor(Math.random() * n);
MG.pick = a => a[Math.floor(Math.random() * a.length)];
MG.shuffle = (a, rnd = Math.random) => {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};
MG.sleep = ms => new Promise(r => setTimeout(r, ms));
MG.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
MG.plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
MG.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
MG.rng = seed => { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
MG.fmtTime = ms => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
};
MG.spokenTime = ms => {
  const s = Math.round(ms / 1000), m = Math.floor(s / 60), sec = s % 60;
  return m ? `${m} minute${m === 1 ? '' : 's'} ${sec} second${sec === 1 ? '' : 's'}` : `${sec} seconds`;
};
/* Tiny element builder: MG.h('button', { class: 'x', onclick: fn }, 'text', child) */
MG.h = function (tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }

const mqDark = mq('(prefers-color-scheme: dark)');
const mqReduce = mq('(prefers-reduced-motion: reduce)');
const mqCoarse = mq('(pointer: coarse)');
MG.reduced = () => !!(mqReduce && mqReduce.matches);
MG.style = css => { const el = document.createElement('style'); el.textContent = css; document.head.appendChild(el); return el; };
MG.touch = () => !!(mqCoarse && mqCoarse.matches);
MG.anyDialogOpen = () => !!document.querySelector('dialog[open]');
MG.typing = e => { const t = e.target; return !!(t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]')); };

/* ---------------------------------------------------------------- storage */
MG.store = {
  get(k, def = null) { try { const s = localStorage.getItem('mg:' + k); return s ? JSON.parse(s) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('mg:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem('mg:' + k); } catch (e) { /* storage unavailable */ } },
};

/* ---------------------------------------------------------------- prefs + theme */
MG.prefs = Object.assign({ theme: 'auto', sound: true }, MG.store.get('prefs') || {});
MG.savePrefs = () => MG.store.set('prefs', MG.prefs);
MG.isDark = () => MG.prefs.theme === 'dark' || (MG.prefs.theme === 'auto' && !!mqDark && mqDark.matches);
MG.applyTheme = () => {
  const root = document.documentElement;
  if (MG.prefs.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', MG.prefs.theme);
  let meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
  meta.content = MG.isDark() ? '#11151C' : '#EEF1F5';
  MG.qsa('[data-theme-opt]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeOpt === MG.prefs.theme)));
  document.dispatchEvent(new CustomEvent('mg:theme'));
};
MG.setTheme = t => { MG.prefs.theme = t; MG.savePrefs(); MG.applyTheme(); MG.toParent({ mg: 'theme', theme: t }); };
if (mqDark) { const f = () => MG.applyTheme(); if (mqDark.addEventListener) mqDark.addEventListener('change', f); else if (mqDark.addListener) mqDark.addListener(f); }
MG.applyTheme();
MG.cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------------------------------------------------------------- living inside the launcher
   When a game runs in the one-page launcher, its back button returns to the library,
   and theme changes and pauses travel between the two. */
MG.embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
MG.toParent = msg => { if (MG.embedded) { try { window.parent.postMessage(msg, '*'); } catch (e) { /* no parent */ } } };
window.addEventListener('message', e => {
  if (!MG.embedded || e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
  const d = e.data;
  if (d.mg === 'theme' && d.theme && d.theme !== MG.prefs.theme) { MG.prefs.theme = d.theme; MG.savePrefs(); MG.applyTheme(); }
  else if (d.mg === 'pause' || d.mg === 'resume') document.dispatchEvent(new CustomEvent('mg:' + d.mg));
});

/* ---------------------------------------------------------------- sound: synthesized, nothing to host */
MG.sfx = (() => {
  let ctx = null, gestured = false;
  ['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, () => { gestured = true; }, true));
  const tone = (f, dur = 0.1, type = 'sine', vol = 0.05, at = 0, to) => {
    if (!gestured) return;
    try {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC(); }
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* audio unavailable */ }
  };
  const on = fn => (...a) => { if (MG.prefs.sound) fn(...a); };
  return {
    tone: on(tone),
    place: on(() => tone(660, 0.09, 'sine', 0.05)),
    note: on(() => tone(1320, 0.05, 'sine', 0.02)),
    tap: on(() => tone(880, 0.045, 'sine', 0.03)),
    move: on(() => tone(520, 0.07, 'triangle', 0.045)),
    slide: on(() => tone(340, 0.09, 'triangle', 0.04, 0, 420)),
    flip: on(() => tone(740, 0.06, 'square', 0.015)),
    wrong: on(() => { tone(196, 0.18, 'triangle', 0.07); tone(147, 0.24, 'triangle', 0.06, 0.07); }),
    unit: on(() => [523.3, 659.3, 784].forEach((f, k) => tone(f, 0.16, 'sine', 0.04, k * 0.06))),
    hint: on(() => [784, 1046.5].forEach((f, k) => tone(f, 0.14, 'sine', 0.04, k * 0.08))),
    win: on(() => [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, k) => tone(f, 0.34, 'sine', 0.045, k * 0.09))),
    lose: on(() => [392, 330, 262].forEach((f, k) => tone(f, 0.3, 'triangle', 0.05, k * 0.14))),
    draw: on(() => [523.3, 523.3].forEach((f, k) => tone(f, 0.2, 'sine', 0.04, k * 0.16))),
    blip: on((f = 600, d = 0.12) => tone(f, d, 'sine', 0.05)),
  };
})();

/* ---------------------------------------------------------------- feedback */
let toastTimer = 0;
MG.toast = msg => {
  let el = MG.$('mgToast');
  if (!el) { el = MG.h('div', { class: 'toast', id: 'mgToast', role: 'status', 'aria-live': 'polite' }); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');

MG.announce = msg => {
  let el = MG.$('mgSr');
  if (!el) { el = MG.h('div', { class: 'sr-only', id: 'mgSr', 'aria-live': 'assertive' }); document.body.appendChild(el); }

MG.buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* no haptics */ } };
MG.replay = (node, cls, ms = 500) => {
  if (!node) return;
  node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
  const key = '_t_' + cls; clearTimeout(node[key]); node[key] = setTimeout(() => node.classList.remove(cls), ms);
};

/* Confetti in highlighter colours: rectangles and marker dashes */
MG.confetti = (opts = {}) => {
  if (MG.reduced()) return;
  const cv = MG.h('canvas', { class: 'confetti', 'aria-hidden': 'true' });
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const dark = MG.isDark();
  const cols = ['sudoku', 'logic', 'numbers', 'moves', 'duels', 'brain'].map(c => MG.cssVar(`--c-${c}${dark ? '-deep' : ''}`) || '#FFE15A');
  if (!dark) cols.push(MG.cssVar('--pen') || '#2340B8');
  const N = opts.count || 150, parts = [];
  for (let k = 0; k < N; k++) {
    const side = k % 2 ? 1 : -1;
    const x = opts.x != null ? opts.x : W / 2 + side * W * 0.18, y = opts.y != null ? opts.y : H * 0.42;
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5 - side * 0.25, sp = 7 + Math.random() * 9;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      w: 6 + Math.random() * 7, h: 3 + Math.random() * 4, c: cols[k % cols.length], dash: Math.random() < 0.35, life: 0 });
  }
  let frame = 0;
  const step = () => {
    frame++;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy += 0.24; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;

      ctx.restore();
    }
    if (alive && frame < 170) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
};

/* Swipe on an element: cb('up' | 'down' | 'left' | 'right') */
MG.swipe = (el, cb, min = 26) => {
  let sx = 0, sy = 0, id = null;
  el.addEventListener('pointerdown', e => { id = e.pointerId; sx = e.clientX; sy = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== id) return;
    id = null;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < min) return;
    cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  el.addEventListener('pointercancel', () => { id = null; });
};

/* Key handler that stays quiet while a dialog is open or a field has focus */
MG.onKey = fn => document.addEventListener('keydown', e => {
  if (MG.anyDialogOpen() || e.defaultPrevented || MG.typing(e)) return;
  fn(e);
});

  shuffle: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></g>',
  eye: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>',
  search: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></g>',
  cpu: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></g>',
  user: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>',
  dice: '<g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/></g><g fill="currentColor"><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></g>',
  zap: '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  bomb: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="14" r="7"/><path d="m15.5 9.5 2-2"/><path d="M19 3.5v2M21.5 6h-2M20.3 4.7l-1 1"/></g>',
  grid: '<g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>',
};
MG.icon = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
(function sprite() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '0'); svg.setAttribute('height', '0'); svg.setAttribute('aria-hidden', 'true');
  svg.style.position = 'absolute';
  svg.innerHTML = Object.keys(ICONS).map(k => `<symbol id="i-${k}" viewBox="0 0 24 24">${ICONS[k]}</symbol>`).join('');
  const put = () => document.body.prepend(svg);
  if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
})();

/* ---------------------------------------------------------------- dialogs */
MG.sheet = ({ id, title, html = '', cls = '', wide = false }) => {
  const d = MG.h('dialog', { id, class: wide ? 'wide' : '', 'aria-labelledby': id + 'T' });
  d.innerHTML = `<div class="sheet ${cls}"><div class="sheet-h"><h2 id="${id}T">${title}</h2>
    <button type="button" class="icon-btn" data-close aria-label="Close">${MG.icon('x')}</button></div><div class="sheet-b">${html}</div></div>`;
  document.body.appendChild(d);
  return d;
};
MG.open = d => { if (d.open) return; try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } };
document.addEventListener('click', e => {
  const d = e.target.closest && e.target.closest('dialog');
  if (!d) return;
  if (e.target === d || e.target.closest('[data-close]')) d.close();
});

/* ---------------------------------------------------------------- statistics
   metric: 'time' (lower is better), 'moves' (lower), 'score' (higher), 'duel' (win/loss/draw) */
MG.Stats = function (gameId, levels, metric) {
  const KEY = 'stats:' + gameId;
  const blank = () => ({ started: 0, won: 0, lost: 0, drawn: 0, best: 0, total: 0, streak: 0, bestStreak: 0, last: 0 });
  const raw = MG.store.get(KEY) || {};
  const data = {};
  for (const k of Object.keys(levels)) data[k] = Object.assign(blank(), raw[k] || {});
  const save = () => MG.store.set(KEY, data);
  const lower = metric === 'time' || metric === 'moves';
  return {
    metric, data,
    get: k => data[k],
    start(k) { data[k].started++; save(); MG.recent(gameId); },
    breakStreak(k) { data[k].streak = 0; save(); },
    win(k, value) {
      const s = data[k], first = s.won === 0;
      s.won++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak);
      let isBest = false;
      if (value != null && metric !== 'duel') {
        s.total += value; s.last = value;
        isBest = !s.best || (lower ? value < s.best : value > s.best);
        if (isBest) s.best = value;
      }
      save();
      return { isBest, first };
    },
    loss(k) { data[k].lost++; data[k].streak = 0; save(); },
    draw(k) { data[k].drawn++; save(); },
    reset() { for (const k in data) data[k] = blank(); save(); },
  };
};
MG.recent = id => {
  const list = (MG.store.get('recent') || []).filter(x => x !== id);
  list.unshift(id);
  MG.store.set('recent', list.slice(0, 8));
};
MG.fmtMetric = (metric, v) => !v ? '–' : metric === 'time' ? MG.fmtTime(v) : String(v);

/* =============================================================================
   Shell
   cfg: { id, title, chapter, levels, level, metric, timer, rules, legend,
          settings: [{ key, label, desc, def }], onNew(level), onRestart(),
          onPause(paused), onSetting(key, value), size: { ar, chrome, chromeL, maxW, minW } }
   ============================================================================= */
MG.shell = function (cfg) {
  const levels = cfg.levels || { normal: { name: 'Normal', rank: 2, desc: '' } };
  const levelKeys = Object.keys(levels);
  const metric = cfg.metric || 'time';
  const timed = cfg.timer !== false;
  const PREFKEY = 'game:' + cfg.id + ':prefs';
  const gp = Object.assign({}, ...(cfg.settings || []).map(s => ({ [s.key]: s.def })), MG.store.get(PREFKEY) || {});
  if (!levels[gp.level]) gp.level = cfg.level && levels[cfg.level] ? cfg.level : levelKeys[Math.min(1, levelKeys.length - 1)];
  const savePrefs = () => MG.store.set(PREFKEY, gp);
  const stats = MG.Stats(cfg.id, levels, metric);

  const api = { cfg, levels, stats, status: 'idle', level: gp.level, paused: false, isBusy: false };
  const app = MG.h('div', { class: 'app', 'data-chapter': cfg.chapter || 'sudoku' });
  document.body.dataset.chapter = cfg.chapter || 'sudoku';
  app.innerHTML = `
  <header class="topbar">
    <div class="brand">
      <a class="icon-btn back" href="${MG.root}index.html" aria-label="All games" title="All games">${MG.icon('back')}</a>
      <h1 class="wordmark">${cfg.title}</h1>
    </div>
    <nav class="actions" aria-label="Game menu">
      <button type="button" class="btn-new" data-mg="new" aria-label="New game">${MG.icon('plus')}<span>New game</span></button>
      <button type="button" class="icon-btn" data-mg="rules" aria-label="How to play" title="How to play">${MG.icon('help')}</button>
      <button type="button" class="icon-btn" data-mg="stats" aria-label="Statistics" title="Statistics">${MG.icon('chart')}</button>
      <button type="button" class="icon-btn" data-mg="settings" aria-label="Settings" title="Settings">${MG.icon('sliders')}</button>
    </nav>
  </header>
  <main class="stage">
    <section class="board-frame" aria-label="${MG.esc(cfg.title)}">
      <div class="statusbar">
        <button type="button" class="level" data-mg="level" aria-haspopup="dialog" title="Change level">
          <span class="meter" data-rank="2" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span data-mg="levelName"></span>${MG.icon('chev')}
        </button>
        <div class="status-mid" data-mg="mid"></div>
        <div class="clock${timed ? '' : ' no-time'}" data-mg="clockWrap">
          <span id="clock" data-mg="clock" aria-label="Elapsed time">00:00</span>
          <button type="button" class="icon-btn" data-mg="pause" aria-label="Pause"${timed ? '' : ' hidden'}>${MG.icon('pause')}</button>
        </div>
      </div>
      <div class="board-wrap" data-mg="wrap">
        <div class="board-host" data-mg="board"></div>
        <div class="overlay ov-pause" data-mg="ovPause"><p class="ov-title">Paused</p><p class="ov-text">The clock stops while the board is hidden.</p>
          <button type="button" class="btn btn-primary" data-mg="resume">${MG.icon('play')}Resume</button></div>
        <div class="overlay ov-busy" aria-live="polite"><div class="loader" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p class="ov-text" data-mg="busyText">Getting the board ready.</p></div>
      </div>
    </section>
    <section class="controls" data-mg="controls" aria-label="Controls">
      <div class="coach" data-mg="coach" data-kind="info">
        <svg class="i coach-i" aria-hidden="true"><use data-mg="coachIcon" href="#i-info"/></svg>
        <div class="coach-body"><p class="coach-title" data-mg="coachTitle"></p><p class="coach-text" data-mg="coachText"></p>
          <div class="ticks" data-mg="ticks" hidden aria-hidden="true"><div class="ticks-fill"></div></div></div>
      </div>
    </section>
  </main>`;
  document.body.prepend(app);
  const el = {};
  MG.qsa('[data-mg]', app).forEach(n => { el[n.dataset.mg] = n; });
  api.app = app; api.board = el.board; api.wrap = el.wrap; api.mid = el.mid; api.controls = el.controls;
  MG.qs('.back', app).addEventListener('click', e => { if (MG.embedded) { e.preventDefault(); MG.toParent({ mg: 'home' }); } });
  document.addEventListener('mg:pause', () => { if (timed && api.status === 'playing' && !api.isBusy) api.setPaused(true); });
  document.addEventListener('mg:resume', () => { if (api.paused) api.setPaused(false); });
  if (cfg.legend) el.controls.appendChild(MG.h('dl', { class: 'legend', 'aria-label': 'Keyboard shortcuts', html: cfg.legend }));

  /* sizing */
  api.size = (s = {}) => {
    const st = document.documentElement.style;
    st.setProperty('--ar', String(s.ar || 1));
    if (s.chrome) st.setProperty('--chrome', s.chrome + 'px'); else st.removeProperty('--chrome');
    if (s.chromeL) st.setProperty('--chrome-l', s.chromeL + 'px'); else st.removeProperty('--chrome-l');
    st.setProperty('--max-bw', (s.maxW || 620) + 'px');
    st.setProperty('--min-bw', (s.minW || 232) + 'px');
  };
  api.size(cfg.size);

  /* level */
  const renderLevel = () => {
    const L = levels[api.level];
    el.levelName.textContent = L.name;
    MG.qs('.meter', el.level).dataset.rank = String(L.rank || 2);
    el.level.hidden = levelKeys.length < 2 && !L.name;
  };
  api.setLevel = k => { if (levels[k]) { api.level = k; gp.level = k; savePrefs(); renderLevel(); } };
  renderLevel();
  api.pref = k => gp[k];
  api.setPref = (k, v) => { gp[k] = v; savePrefs(); };

  /* busy + pause */
  api.busy = (on, text) => {
    api.isBusy = !!on;
    if (text) el.busyText.textContent = text;
    el.wrap.classList.toggle('is-busy', api.isBusy);
    syncPause();
  };
  const syncPause = () => {
    el.wrap.classList.toggle('is-paused', api.paused);
    el.pause.disabled = api.status !== 'playing' || api.isBusy;
    MG.qs('use', el.pause).setAttribute('href', api.paused ? '#i-play' : '#i-pause');
    el.pause.setAttribute('aria-label', api.paused ? 'Resume' : 'Pause');
  };
  api.setPaused = p => {
    if (!timed || api.status !== 'playing' || api.isBusy) p = false;
    if (api.paused === p) return;
    api.paused = p;
    syncPause();
    if (cfg.onPause) cfg.onPause(p);
  };
  api.canPlay = () => api.status === 'playing' && !api.paused && !api.isBusy;

  /* clock */
  let elapsed = 0, ticking = false, last = performance.now();
  const running = () => ticking && api.status === 'playing' && !api.paused && !api.isBusy && !document.hidden && !MG.anyDialogOpen();
  const renderClock = () => { const t = MG.fmtTime(elapsed); if (el.clock.textContent !== t) el.clock.textContent = t; };
  api.timer = {
    start() { ticking = true; last = performance.now(); },
    stop() { ticking = false; },
    reset(ms = 0) { elapsed = ms; renderClock(); },
    get elapsed() { return elapsed; },
    set elapsed(v) { elapsed = v; renderClock(); },
  };
  setInterval(() => {
    const now = performance.now(), dt = now - last;
    last = now;
    if (running()) { elapsed += Math.min(dt, 1000); if (cfg.onTick) cfg.onTick(elapsed); }
    renderClock();
  }, 250);
  api.showClock = on => el.clockWrap.classList.toggle('no-time', !on);

  /* coach line */
  const COACH = { info: 'info', progress: 'target', hint: 'bulb', mistake: 'heart-crack', lost: 'heart-crack', done: 'check', good: 'check', turn: 'user', cpu: 'cpu' };
  let base = { kind: 'info', title: '', text: '', frac: null, n: 0 }, temp = null, coachTimer = 0;
  const renderCoach = () => {
    const c = temp || base;
    el.coach.dataset.kind = c.kind;
    el.coachIcon.setAttribute('href', '#i-' + (COACH[c.kind] || 'info'));
    if (el.coachTitle.textContent !== c.title) el.coachTitle.textContent = c.title;
    if (el.coachText.textContent !== (c.text || '')) el.coachText.textContent = c.text || '';
    const showTicks = !temp && base.frac != null;
    el.ticks.hidden = !showTicks;
    if (showTicks) { el.ticks.style.setProperty('--n', String(base.n || 50)); el.ticks.style.setProperty('--p', (base.frac * 100) + '%'); }
  };
  api.coach = (kind, title, text, ms) => {
    temp = { kind, title, text }; clearTimeout(coachTimer);
    if (ms) coachTimer = setTimeout(() => { temp = null; renderCoach(); }, ms);
    renderCoach();
  };
  api.clearCoach = () => { temp = null; clearTimeout(coachTimer); renderCoach(); };
  api.progress = (title, text, frac = null, n = 0, kind = 'progress') => { base = { kind, title, text, frac, n }; renderCoach(); };

  /* hearts (lifelines) */
  const HEART = 'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z';
  api.hearts = (left, max) => {
    let h = MG.qs('.hearts', el.mid);
    if (!h) { h = MG.h('div', { class: 'hearts', role: 'img' }); el.mid.prepend(h); }
    if (h.children.length !== max) h.innerHTML = MG.range(max).map(() => `<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path class="h-fill" d="${HEART}"/><path class="h-strike" d="M3.5 20.5 20.5 3.5"/></svg>`).join('');
    Array.from(h.children).forEach((x, k) => x.classList.toggle('lost', k >= left));
    h.setAttribute('aria-label', `${left} of ${max} lifelines left`);
    h.classList.toggle('off', max === 0);
    return h;
  };
  api.breakHeart = k => { const h = MG.qs('.hearts', el.mid); if (h && h.children[k]) MG.replay(h.children[k], 'breaking', 600); };

  /* rules */
  const dRules = MG.sheet({ id: 'dlgRules', title: 'How to play', wide: true,
    html: `<div class="rules">${cfg.rules || ''}</div><div class="btn-row"><button type="button" class="btn btn-primary wide" data-close>Play</button></div>` });
  api.openRules = () => MG.open(dRules);

  /* levels / new game */
  const dNew = MG.sheet({ id: 'dlgNew', title: 'New game', html: `<p class="sheet-p">${cfg.newText || 'Pick a level.'}</p><div class="levels" data-levels></div>
    <div class="sheet-foot"${cfg.onRestart ? '' : ' hidden'}><button type="button" class="btn btn-quiet" data-restart>${MG.icon('restart')}Restart this game</button></div>` });
  const levelsBox = MG.qs('[data-levels]', dNew);
  api.openLevels = () => {
    levelsBox.innerHTML = levelKeys.map(k => {
      const L = levels[k], s = stats.get(k);
      const best = metric === 'duel' ? (s.won ? `${s.won} won` : '') : s.best ? 'Best ' + MG.fmtMetric(metric, s.best) : '';
      return `<button type="button" class="lvl" data-level="${k}"${k === api.level ? ' aria-current="true"' : ''}>
        <span class="meter" data-rank="${L.rank || 2}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span><span class="lvl-name">${L.name}</span><span class="lvl-desc">${L.desc || ''}</span></span>
        <span class="lvl-best">${best}</span></button>`;
    }).join('');
    MG.qs('[data-restart]', dNew).disabled = api.isBusy || api.status === 'idle';
    MG.open(dNew);
  };
  levelsBox.addEventListener('click', e => {
    const b = e.target.closest('[data-level]');
    if (!b) return;
    dNew.close();
    api.newGame(b.dataset.level);
  });
  MG.qs('[data-restart]', dNew).addEventListener('click', () => { dNew.close(); api.restart(); });
  api.newGame = k => {
    if (api.isBusy) return;
    if (api.status === 'playing' && api.dirty) stats.breakStreak(api.level);
    api.setLevel(k || api.level);
    api.paused = false; syncPause(); api.clearCoach();
    if (cfg.onNew) cfg.onNew(api.level);
  };
  api.restart = () => {
    if (!cfg.onRestart || api.isBusy) return;
    if (api.status === 'playing' && api.dirty) stats.breakStreak(api.level);
    api.paused = false; syncPause(); api.clearCoach();
    cfg.onRestart();
  };

  /* game lifecycle */
  api.dirty = false;
  api.begin = (opts = {}) => {
    api.status = 'playing'; api.dirty = false;
    if (!opts.resumed) stats.start(api.level); else MG.recent(cfg.id);
    api.timer.reset(opts.elapsed || 0);
    if (timed) api.timer.start();
    api.busy(false); syncPause();
  };
  const finish = () => { api.timer.stop(); api.paused = false; syncPause(); };
  api.win = (o = {}) => {
    if (api.status !== 'playing') return {};
    api.status = 'won'; finish();
    const value = o.value != null ? o.value : metric === 'time' ? elapsed : null;
    const r = stats.win(api.level, value);
    MG.sfx.win(); MG.buzz([30, 50, 30]);
    if (!o.quiet) MG.confetti();
    const L = levels[api.level], lvl = L.name.toLowerCase();
    const badge = o.badge !== undefined ? o.badge : r.isBest ? (r.first ? `Your first ${lvl} win` : metric === 'time' ? 'New best time' : metric === 'score' ? 'New best score' : 'New record') : r.first ? `Your first ${lvl} win` : '';
    setTimeout(() => api.end(Object.assign({ kind: 'won', title: 'Solved', big: value != null ? MG.fmtMetric(metric, value) : '', badge }, o)), o.delay != null ? o.delay : MG.reduced() ? 150 : 1200);
    return r;
  };
  api.lose = (o = {}) => {
    if (api.status !== 'playing') return;
    api.status = 'lost'; finish();
    stats.loss(api.level);
    MG.sfx.lose(); MG.buzz(80);
    setTimeout(() => api.end(Object.assign({ kind: 'lost', title: 'Game over' }, o)), o.delay != null ? o.delay : 900);
  };
  api.draw = (o = {}) => {
    if (api.status !== 'playing') return;
    api.status = 'draw'; finish();
    stats.draw(api.level);
    MG.sfx.draw();
    setTimeout(() => api.end(Object.assign({ kind: 'draw', title: 'Draw' }, o)), o.delay != null ? o.delay : 900);
  };
  /* Score games: record the score and show the sheet */
  api.over = (o = {}) => {
    if (api.status !== 'playing') return {};
    api.status = 'over'; finish();
    const r = stats.win(api.level, o.value || 0);
    const good = r.isBest && o.value > 0;
    if (good) { MG.sfx.win(); if (!o.quiet) MG.confetti(); } else MG.sfx.draw();
    setTimeout(() => api.end(Object.assign({ kind: good ? 'won' : 'draw', title: 'Game over', big: String(o.value || 0), badge: good ? 'New best score' : '' }, o)), o.delay != null ? o.delay : 700);
    return r;
  };

  /* end sheet */
  const dEnd = MG.h('dialog', { id: 'dlgEnd', 'aria-labelledby': 'endTitle' });
  dEnd.innerHTML = '<div class="sheet end" data-end></div>';
  document.body.appendChild(dEnd);
  const endSheet = MG.qs('[data-end]', dEnd);
  let endActs = {};
  api.end = (o) => {
    const L = levels[api.level], lvl = L.name.toLowerCase();
    const icons = { won: 'check', lost: 'heart-crack', draw: 'info', over: 'trophy' };
    const facts = o.facts || [];
    endActs = {
      again: () => api.newGame(api.level), levels: () => api.openLevels(), retry: () => api.restart(), close: () => {},
    };
    (o.actions || []).forEach((a, k) => { endActs['x' + k] = a.act; });
    const primary = o.primary || (o.kind === 'lost' && cfg.onRestart ? { label: 'Retry this game', act: 'retry' } : { label: levelKeys.length > 1 ? `New ${lvl} game` : 'Play again', act: 'again' });
    const extra = (o.actions || []).map((a, k) => `<button type="button" class="btn btn-quiet" data-act="x${k}">${a.label}</button>`).join('');
    endSheet.innerHTML = `<button type="button" class="icon-btn end-x" data-close aria-label="Close">${MG.icon('x')}</button>
      <div class="end-mark ${o.kind === 'won' ? '' : o.kind}">${MG.icon(o.icon || icons[o.kind] || 'check', 'lg')}</div>
      <h2 id="endTitle">${o.title}</h2>
      ${o.sub ? `<p class="end-sub">${o.sub}</p>` : ''}
      ${o.big ? `<p class="end-big">${o.big}</p>` : ''}
      ${o.badge ? `<p class="end-badge">${o.badge}</p>` : ''}
      ${facts.length ? `<div class="end-facts" style="--facts:${facts.length}">${facts.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : ''}
      <div class="btn-row">
        ${levelKeys.length > 1 ? '<button type="button" class="btn btn-quiet" data-act="levels">Change level</button>' : ''}
        ${extra}
        <button type="button" class="btn btn-primary${o.kind === 'lost' ? ' wide' : ''}" data-act="${primary.act}" autofocus>${primary.act === 'retry' ? MG.icon('restart') : ''}${primary.label}</button>
      </div>`;
    if (o.kind === 'lost' && cfg.onRestart && primary.act === 'retry') {
      const row = MG.qs('.btn-row', endSheet);
      row.appendChild(MG.h('button', { type: 'button', class: 'btn btn-quiet', 'data-act': 'again', text: 'New game' }));
    }
    MG.open(dEnd);
  };
  dEnd.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const f = endActs[b.dataset.act];
    dEnd.close();
    if (f) f();
  });

  /* stats */
  const dStats = MG.sheet({ id: 'dlgStats', title: 'Statistics',
    html: `<div class="seg wide" role="group" aria-label="Level" data-seg${levelKeys.length < 2 ? ' hidden' : ''}>${levelKeys.map(k => `<button type="button" data-sl="${k}">${levels[k].short || levels[k].name}</button>`).join('')}</div>
      <div class="stats-grid" data-grid></div>
      <div class="sheet-foot"><button type="button" class="btn btn-quiet btn-danger" data-reset>Reset statistics</button></div>` });
  let statsLevel = api.level;
  const renderStats = () => {
    const s = stats.get(statsLevel);
    MG.qsa('[data-sl]', dStats).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sl === statsLevel)));
    let tiles;
    if (metric === 'duel') {
      const played = s.won + s.lost + s.drawn;
      tiles = [[played, 'Games played'], [s.won, 'Won'], [s.lost, 'Lost'], [s.drawn, 'Drawn'], [played ? Math.round(s.won / played * 100) + '%' : '–', 'Win rate'], [s.streak, `Win streak (best ${s.bestStreak})`]];
    } else if (metric === 'score') {
      tiles = [[s.won, 'Games played'], [s.best || '–', 'Best score'], [s.won ? Math.round(s.total / s.won) : '–', 'Average score'], [s.last || '–', 'Last score'], [s.total || 0, 'Total points'], [s.started, 'Games started']];
    } else {
      const f = v => MG.fmtMetric(metric, v);
      tiles = [[s.started, 'Games started'], [s.won, 'Games won'], [s.started ? Math.round((s.won / s.started) * 100) + '%' : '–', 'Win rate'],
        [f(s.best), metric === 'time' ? 'Best time' : 'Fewest moves'], [s.won ? f(Math.round(s.total / s.won)) : '–', metric === 'time' ? 'Average win' : 'Average moves'], [s.streak, `Win streak (best ${s.bestStreak})`]];
    }
    MG.qs('[data-grid]', dStats).innerHTML = tiles.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  };
  MG.qs('[data-seg]', dStats).addEventListener('click', e => { const b = e.target.closest('[data-sl]'); if (b) { statsLevel = b.dataset.sl; renderStats(); } });
  const resetBtn = MG.qs('[data-reset]', dStats);
  resetBtn.addEventListener('click', () => {
    if (resetBtn.dataset.armed !== '1') {
      resetBtn.dataset.armed = '1'; resetBtn.textContent = 'Tap again to erase all statistics';
      setTimeout(() => { resetBtn.dataset.armed = ''; resetBtn.textContent = 'Reset statistics'; }, 3500);
      return;
    }
    stats.reset(); resetBtn.dataset.armed = ''; resetBtn.textContent = 'Reset statistics'; renderStats(); MG.toast('Statistics erased');
  });
  api.openStats = () => { statsLevel = api.level; renderStats(); MG.open(dStats); };

  /* settings */
  const gameRows = (cfg.settings || []).map(s => `<label class="set-row"><span><b>${s.label}</b>${s.desc ? `<small>${s.desc}</small>` : ''}</span>
    <input type="checkbox" class="switch" role="switch" data-gs="${s.key}"></label>`).join('');
  const dSet = MG.sheet({ id: 'dlgSettings', title: 'Settings', html: `
    <div class="set-row"><span><b>Theme</b><small>Auto follows your device.</small></span>
      <div class="seg" role="group" aria-label="Theme"><button type="button" data-theme-opt="auto">Auto</button><button type="button" data-theme-opt="light">Light</button><button type="button" data-theme-opt="dark">Dark</button></div></div>
    <label class="set-row"><span><b>Sound effects</b></span><input type="checkbox" class="switch" role="switch" data-sound></label>
    ${gameRows}` });
  MG.qsa('[data-theme-opt]', dSet).forEach(b => b.addEventListener('click', () => MG.setTheme(b.dataset.themeOpt)));
  const snd = MG.qs('[data-sound]', dSet);
  snd.addEventListener('change', () => { MG.prefs.sound = snd.checked; MG.savePrefs(); });
  MG.qsa('[data-gs]', dSet).forEach(inp => inp.addEventListener('change', () => {
    gp[inp.dataset.gs] = inp.checked; savePrefs();
    if (cfg.onSetting) cfg.onSetting(inp.dataset.gs, inp.checked);
  }));
  api.openSettings = () => {
    snd.checked = !!MG.prefs.sound;
    MG.qsa('[data-gs]', dSet).forEach(inp => { inp.checked = !!gp[inp.dataset.gs]; });
    MG.applyTheme();
    MG.open(dSet);
  };

  /* wiring */
  el.new.addEventListener('click', () => (levelKeys.length > 1 || cfg.onRestart ? api.openLevels() : api.newGame()));
  el.level.addEventListener('click', api.openLevels);
  el.rules.addEventListener('click', api.openRules);
  el.stats.addEventListener('click', api.openStats);
  el.settings.addEventListener('click', api.openSettings);
  el.pause.addEventListener('click', () => api.setPaused(!api.paused));
  el.resume.addEventListener('click', e => { e.stopPropagation(); api.setPaused(false); });
  el.ovPause.addEventListener('click', () => api.setPaused(false));
  MG.onKey(e => {
    if ((e.key === 'p' || e.key === 'P') && timed && !e.ctrlKey && !e.metaKey && !e.altKey) { api.setPaused(!api.paused); e.preventDefault(); }
    else if (e.key === '?' ) { api.openRules(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (cfg.onHide) cfg.onHide(); if (timed && api.status === 'playing' && elapsed > 1500) api.setPaused(true); }
  });
  window.addEventListener('pagehide', () => { if (cfg.onHide) cfg.onHide(); });

  /* first visit: show the rules once */
  api.firstVisit = !MG.store.get('seen:' + cfg.id);
  if (api.firstVisit && cfg.rules) {
    MG.store.set('seen:' + cfg.id, 1);
    setTimeout(() => MG.open(dRules), 350);
  }
  syncPause();
  return api;
};
})();

</script>

2E;\n  --peer: #EDF1F7;\n  --red: #D21F3C;\n  --red-soft: #FDE6EA;\n  --green: #0E8F63;\n  --green-soft: #DCF3E9;\n  --on-green: #FFFFFF;\n  --veil: rgba(255, 255, 255, .78);\n  --shadow-pop: 0 30px 80px -30px rgba(20, 30, 50, .45), 0 2px 8px rgba(20, 30, 50, .08);\n\n  /* Chapter highlighters (light) */\n  --c-sudoku: #FFE15A;  --c-sudoku-soft: #FFF1A6;  --c-sudoku-deep: #C99A00;\n  --c-logic: #FFA9D7;   --c-logic-soft: #FFDDEF;   --c-logic-deep: #D4377F;\n  --c-numbers: #FFC07A; --c-numbers-soft: #FFE4C4; --c-numbers-deep: #D86F00;\n  --c-moves: #C3EE7C;   --c-moves-soft: #E7F8CB;   --c-moves-deep: #5E9A0E;\n  --c-duels: #92DBFF;   --c-duels-soft: #D5F0FF;   --c-duels-deep: #1580C2;\n  --c-brain: #CDBDFF;   --c-brain-soft: #EAE3FF;   --c-brain-deep: #6A4BE0;\n\n  --ch: var(--c-sudoku); --ch-soft: var(--c-sudoku-soft); --ch-deep: var(--c-sudoku-deep);\n\n  --font: 'Recursive', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\n  --casual: 'CASL' 1;\n\n  /* Board sizing. Games set --ar (width / height), --chrome and --max-bw. */\n  --vh: 100vh;\n  --ar: 1;\n  --chrome: 330px;\n  --max-bw: 620px;\n  --min-bw: 232px;\n  --safe-y: calc(env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));\n  --avail-w: calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));\n  --avail-h: calc(var(--vh) - var(--chrome) - var(--safe-y));\n  --bw: max(var(--min-bw), min(var(--avail-w), calc(var(--avail-h) * var(--ar)), var(--max-bw)));\n  --bh: calc(var(--bw) / var(--ar));\n  --panel: max(var(--bw), min(var(--avail-w), 420px));\n}\n@supports (height: 100dvh) { :root { --vh: 100dvh; } }\n\n[data-chapter=\"sudoku\"]  { --ch: var(--c-sudoku);  --ch-soft: var(--c-sudoku-soft);  --ch-deep: var(--c-sudoku-deep); }\n[data-chapter=\"logic\"]   { --ch: var(--c-logic);   --ch-soft: var(--c-logic-soft);   --ch-deep: var(--c-logic-deep); }\n[data-chapter=\"numbers\"] { --ch: var(--c-numbers); --ch-soft: var(--c-numbers-soft); --ch-deep: var(--c-numbers-deep); }\n[data-chapter=\"moves\"]   { --ch: var(--c-moves);   --ch-soft: var(--c-moves-soft);   --ch-deep: var(--c-moves-deep); }\n[data-chapter=\"duels\"]   { --ch: var(--c-duels);   --ch-soft: var(--c-duels-soft);   --ch-deep: var(--c-duels-deep); }\n[data-chapter=\"brain\"]   { --ch: var(--c-brain);   --ch-soft: var(--c-brain-soft);   --ch-deep: var(--c-brain-deep); }\n/* Inside a game the chapter highlighter is the selection colour */\n.app[data-chapter] { --hl: var(--ch); --hl-soft: var(--ch-soft); --hl-ring: var(--ch-deep); }\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    color-scheme: dark;\n    --paper: #11151C; --grid-minor: rgba(150, 175, 220, .035); --grid-major: rgba(150, 175, 220, .065);\n    --sheet: #1A1F28; --sheet-2: #212732; --tint: rgba(233, 236, 242, .07);\n    --graphite: #E9ECF2; --graphite-2: #A6AEBE; --pencil: #7A8396; --rule: #2B3240; --frame: #6E788C;\n    --pen: #93AAFF; --pen-soft: #252E4A; --on-pen: #11151C;\n    --hl: #4A4218; --hl-soft: #3A3417; --hl-ring: #E8C547; --hl-ink: #FFF3B8; --peer: #20262F;\n    --red: #FF6F84; --red-soft: #3B1D24; --green: #4FD6A0; --green-soft: #15342A; --on-green: #0D1A14;\n    --veil: rgba(26, 31, 40, .8);\n    --shadow-pop: 0 30px 80px -30px rgba(0, 0, 0, .75), 0 2px 8px rgba(0, 0, 0, .35);\n    --c-sudoku: #4A4218;  --c-sudoku-soft: #3A3417;  --c-sudoku-deep: #E8C547;\n    --c-logic: #4D2440;   --c-logic-soft: #3A1D31;   --c-logic-deep: #FF8CC8;\n    --c-numbers: #4D3418; --c-numbers-soft: #3B2A17; --c-numbers-deep: #FFB25C;\n    --c-moves: #2F4519;   --c-moves-soft: #253517;   --c-moves-deep: #B4E66A;\n    --c-duels: #183E52;   --c-duels-soft: #15303F;   --c-duels-deep: #7CCFFF;\n    --c-brain: #33285A;   --c-brain-soft: #282145;   --c-brain-deep: #B8A6FF;\n  }\n}\n:root[data-theme=\"dark\"] {\n  color-scheme: dark;\n  --paper: #11151C; --grid-minor: rgba(150, 175, 220, .035); --grid-major: rgba(150, 175, 220, .065);\n  --sheet: #1A1F28; --sheet-2: #212732; --tint: rgba(233, 236, 242, .07);\n  --graphite: #E9ECF2; --graphite-2: #A6AEBE; --pencil: #7A8396; --rule: #2B3240; --frame: #6E788C;\n  --pen: #93AAFF; --pen-soft: #252E4A; --on-pen: #11151C;\n  --hl: #4A4218; --hl-soft: #3A3417; --hl-ring: #E8C547; --hl-ink: #FFF3B8; --peer: #20262F;\n  --red: #FF6F84; --red-soft: #3B1D24; --green: #4FD6A0; --green-soft: #15342A; --on-green: #0D1A14;\n  --veil: rgba(26, 31, 40, .8);\n  --shadow-pop: 0 30px 80px -30px rgba(0, 0, 0, .75), 0 2px 8px rgba(0, 0, 0, .35);\n  --c-sudoku: #4A4218;  --c-sudoku-soft: #3A3417;  --c-sudoku-deep: #E8C547;\n  --c-logic: #4D2440;   --c-logic-soft: #3A1D31;   --c-logic-deep: #FF8CC8;\n  --c-numbers: #4D3418; --c-numbers-soft: #3B2A17; --c-numbers-deep: #FFB25C;\n  --c-moves: #2F4519;   --c-moves-soft: #253517;   --c-moves-deep: #B4E66A;\n  --c-duels: #183E52;   --c-duels-soft: #15303F;   --c-duels-deep: #7CCFFF;\n  --c-brain: #33285A;   --c-brain-soft: #282145;   --c-brain-deep: #B8A6FF;\n}\n\n/* ==========================================================================\n   Base\n   ========================================================================== */\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; min-height: 100vh; min-height: var(--vh);\n  font-family: var(--font); font-size: 15px; line-height: 1.45;\n  color: var(--graphite); background-color: var(--paper);\n  background-image:\n    linear-gradient(var(--grid-major) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),\n    linear-gradient(var(--grid-minor) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);\n  background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px;\n  background-position: -1px -1px; background-attachment: fixed;\n  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;\n  -webkit-tap-highlight-colo .4-8.3 0-3.5-2.6-6.2-6.6-6.7l-.8-1.5-1.6 2.6C5 6 4 8 4.4 10.6l3.4.4 1.8-1.6c.6 2.5-2.6 5.5-2.6 9.1z\"/><\/svg>';\nconst JUMPS = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];\nlet S = null, els = [], box = null;\nconst api = MG.shell({ id: 'knights-tour', title: \"Knight's Tour\", chapter: 'moves', levels: LEVELS, metric: 'time', rules: RULES, onNew: newGame, onRestart: () => newGame(api.level), size: { ar: 1, chrome: 230, maxW: 600 } });\napi.mid.innerHTML = '<span class=\"pill\">Visited <b data-v>1<\/b><\/span>';\nconst tools = MG.h('div', { class: 'tools', style: { '--tools': 2 } });\ntools.innerHTML = `<button type=\"button\" class=\"tool\" data-u><span class=\"ti\">${MG.icon('undo')}<\/span><span>Undo<\/span><\/button><button type=\"button\" class=\"tool\" data-h><span class=\"ti\">${MG.icon('bulb')}<\/span><span>Hint<\/span><\/button>`;\napi.controls.appendChild(tools);\ntools.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-u')) undo(); else hint(); });\nconst moves = (i, seen) => { const n = S.n, r = (i / n) | 0, c = i % n; return JUMPS.map(([dr, dc]) => [r + dr, c + dc]).filter(([y, x]) => y >= 0 && x >= 0 && y < n && x < n && !seen.has(y * n + x)).map(([y, x]) => y * n + x); };\nfunction newGame(level) {\n  const n = LEVELS[level].n;\n  S = { n, path: [0], hints: 0 };\n  box = MG.h('div', { class: 'kt', role: 'grid' }); box.style.setProperty('--n', n); box.style.gridTemplateColumns = `repeat(${n}, 1fr)`;\n  els = MG.range(n * n).map(i => { const b = MG.h('button', { type: 'button', 'data-i': i, class: ((i % n) + ((i / n) | 0)) % 2 ? 'dk' : '' }); box.appendChild(b); return b; });\n  box.insertAdjacentHTML('beforeend', `<svg class=\"path\" viewBox=\"0 0 ${n} ${n}\" preserveAspectRatio=\"none\"><polyline points=\"\"/><\/svg>`);\n  api.board.innerHTML = ''; api.board.appendChild(box);\n  box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) ju VELS = {\n  easy: { name: 'Easy', rank: 1, band: [4, 8], desc: 'Solvable in 4 to 8 moves.' },\n  medium: { name: 'Medium', rank: 2, band: [9, 15], desc: 'Solvable in 9 to 15 moves.' },\n  hard: { name: 'Hard', rank: 3, band: [16, 99], desc: 'The hardest position in its family, 16 moves or more when possible.' },\n};\nconst COLS = ['var(--c-sudoku)', 'var(--c-duels)', 'var(--c-moves)', 'var(--c-brain)', 'var(--c-numbers)', 'var(--c-logic)'];\nconst RULES = `<p>Get the red car out through the gap on the right side of the lot.<\/p><ul>\n<li>Drag a vehicle along its length: cars and lorries only move forwards or backwards, never sideways.<\/li>\n<li>Vehicles can't pass through each other.<\/li><li>Sliding one vehicle any distance counts as one move.<\/li><\/ul>\n<p class=\"tip\">Each board is solved in advance by a computer, so you know the fewest moves possible before you start.<\/p>`;\nconst N = 6;\n/* vehicles: [horizontal, length, fixed row or column]; a state lists each vehicle's position along its track */\nfunction cellsOf(v, p) { const [h, len, line] = v, out = []; for (let k = 0; k < len; k++) out.push(h ? line * N + p + k : (p + k) * N + line); return out; }\nfunction nexts(V, st) {\n  const occ = new Int8Array(N * N).fill(-1);\n  V.forEach((v, k) => cellsOf(v, st[k]).forEach(i => { occ[i] = k; }));\n  const out = [];\n  V.forEach((v, k) => {\n    const [h, len, line] = v, at = p => (h ? line * N + p : p * N + line);\n    for (let p = st[k] - 1; p >= 0 && occ[at(p)] < 0; p--) { const s = st.slice(); s[k] = p; out.push(s); }\n    for (let p = st[k] + 1; p + len - 1 < N && occ[at(p + len - 1)] < 0; p++) { const s = st.slice(); s[k] = p; out.push(s); }\n  });\n  return out;\n}\nfunction randomLot() {\n  const occ = new Uint8Array(N * N), V = [[1, 2, 2]], st = [MG.rand(3)];\n  cellsOf(V[0], st[0]).forEach(i => { occ[i] = 1; });\n  const want = 9 + MG.rand(5);\n  for (let t = 0; t < 300 && V.length < want; t++) {\n    const h = Math.random() < .5 ? 1 : 0, len = Mat Math.abs(dr), Math.abs(dc)); dr = Math.sign(dr) * m; dc = Math.sign(dc) * m; }\n  const n = S.n; let r = a[0] + dr, c = a[1] + dc;\n  while (r < 0 || c < 0 || r >= n || c >= n) { dr -= Math.sign(dr); dc -= Math.sign(dc); r = a[0] + dr; c = a[1] + dc; }\n  return [r, c];\n}\nfunction bind() {\n  let start = null, end = null;\n  const line = MG.qs('[data-c]', svg), set = (a, b) => { line.setAttribute('x1', a[1] + .5); line.setAttribute('y1', a[0] + .5); line.setAttribute('x2', b[1] + .5); line.setAttribute('y2', b[0] + .5); };\n  box.addEventListener('pointerdown', e => { if (!api.canPlay()) return; start = cellAt(e); end = start; set(start, end); line.classList.add('on'); box.setPointerCapture(e.pointerId); });\n  box.addEventListener('pointermove', e => { if (!start) return; end = snap(start, cellAt(e)); set(start, end); });\n  const up = () => {\n    if (!start) return;\n    const dr = Math.sign(end[0] - start[0]), dc = Math.sign(end[1] - start[1]), len = Math.max(Math.abs(end[0] - start[0]), Math.abs(end[1] - start[1])) + 1;\n    let word = ''; for (let i = 0; i < len; i++) word += S.g[(start[0] + dr * i) * S.n + start[1] + dc * i];\n    const back = word.split('').reverse().join('');\n    const hit = S.words.find(w => !S.found.includes(w.w) && (w.w === word || w.w === back));\n    if (hit && len > 1) { S.found.push(hit.w); S.lines = S.lines || []; S.lines.push([start, end]); api.dirty = true; MG.sfx.unit(); render(); check(); }\n    else if (len > 2) MG.sfx.wrong();\n    start = null; line.classList.remove('on');\n  };\n  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);\n}\nfunction render() {\n  MG.qs('[data-f]', svg).innerHTML = (S.lines || []).map(([a, b], k) => `<line x1=\"${a[1] + .5}\" y1=\"${a[0] + .5}\" x2=\"${b[1] + .5}\" y2=\"${b[0] + .5}\" stroke=\"${HL[k % HL.length]}\" stroke-width=\".74\"/>`).join('');\n  list.innerHTML = S.words.map(w => `<span class=\"${S.found.includes(w.w) ? 'f' : ''}\">${w.w}<\/span>`).join(''); 0, .035);\n  --grid-major: rgba(150, 175, 220, .065);\n  --sheet: #1A1F28;\n  --sheet-2: #212732;\n  --tint: rgba(233, 236, 242, .07);\n  --graphite: #E9ECF2;\n  --graphite-2: #A6AEBE;\n  --pencil: #7A8396;\n  --rule: #2B3240;\n  --frame: #6E788C;\n  --pen: #93AAFF;\n  --on-pen: #11151C;\n  --hl: #4A4218;\n  --hl-soft: #3A3417;\n  --hl-ring: #E8C547;\n  --hl-ink: #FFF3B8;\n  --peer: #20262F;\n  --red: #FF6F84;\n  --red-soft: #3B1D24;\n  --green: #4FD6A0;\n  --green-soft: #15342A;\n  --on-green: #0D1A14;\n  --veil: rgba(26, 31, 40, .8);\n  --shadow-pop: 0 30px 80px -30px rgba(0, 0, 0, .75), 0 2px 8px rgba(0, 0, 0, .35);\n}\n\n/* ==========================================================================\n   Base\n   ========================================================================== */\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0;\n  min-height: 100vh;\n  min-height: var(--vh);\n  font-family: var(--font);\n  font-size: 15px;\n  line-height: 1.45;\n  color: var(--graphite);\n  background-color: var(--paper);\n  background-image:\n    linear-gradient(var(--grid-major) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),\n    linear-gradient(var(--grid-minor) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);\n  background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px;\n  background-position: -1px -1px;\n  background-attachment: fixed;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  -webkit-tap-highlight-color: transparent;\n  touch-action: manipulation;\n}\nbutton { font-family: inherit; color: inherit; }\n:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }\n.i { width: 20px; height: 20px; flex: none; display: block; }\n.i.lg { width: 30px; height: 30px; }\n.sr-only { position: absolute; width: 1px; height: 1px; padding:
