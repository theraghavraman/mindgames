n}\n.btn-new:active { transform: translateY(1px); }\n.icon-btn.back { margin-left: -8px; margin-right: -4px; color: var(--graphite); text-decoration: none; }\n@media (max-width: 430px) { .mark { display: none; } }\n.rules { font-size: 14.5px; line-height: 1.5; }\n.rules p { margin: 0 0 10px; }\n.rules ul { margin: 0 0 12px; padding-left: 20px; }\n.rules li { margin: 0 0 6px; }\n.rules li::marker { color: var(--hl-ring); font-weight: 800; }\n.rules .tip { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--sheet-2); color: var(--graphite-2); font-size: 13.5px; }\n\n/* ==========================================================================\n   Stage\n   ========================================================================== */\n.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n\n/* Board frame: status bar, coordinate rulers and the board share one grid\n   so the rulers line up with the cells to the pixel. */\n.board-frame {\n  display: grid;\n  grid-template-columns: var(--ruler) var(--board);\n  grid-template-rows: auto var(--ruler) var(--board);\n  transform: translateX(calc(var(--ruler) / -2));\n}\n.statusbar { grid-area: 1 / 2; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }\n.level {\n  display: inline-flex; align-items: center; gap: 8px; height: 34px; margin-left: -8px; padding: 0 8px;\n  border: 0; border-radius: 10px; background: none; color: var(--graphite);\n  font-size: 15px; font-weight: 700; cursor: pointer;\n}\n.level:hover { background: var(--tint); }\n.level .i { width: 16px; height: 16px; color: var(--pencil); }\n.meter { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }\n.meter i { width: 4px; border-radius: 1px; background: var(--rule); }\n.meter i:nth-child(1) { height: 5px; }\n.meter i:nth-child(2) { height: 8px; }\n.meter i:nth-child(3) { height: 11px; }\n.meter i:nth-child(4) { height: 14px; }\n.meter[data-rank=\"1\"] i:nth-child(-n+1),\n.meter[data-rank=\"2\"] i:nth-child(-n+2),\n.meter[data-rank=\"3\"] i:nth-child(-n+3),\n.meter[data-rank=\"4\"] i { background: var(--graphite); }\n\n.hearts { display: flex; align-items: center; gap: 5px; }\n.heart { width: 22px; height: 22px; overflow: visible; }\n.heart .h-fill { fill: var(--red); stroke: var(--red); stroke-width: 1.5; stroke-linejoin: round; transition: fill .3s, stroke .3s; }\n.heart .h-strike {\n  fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round;\n  stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .35s .12s ease-out;\n}\n.heart.lost .h-fill { fill: transparent; stroke: var(--pencil); }\n.heart.lost .h-strike { stroke-dashoffset: 0; }\n.heart.breaking { animation: heart-hit .55s ease-out; }\n@keyframes heart-hit { 30% { transform: scale(1.35) rotate(-10deg); } 65% { transform: scale(.9) rotate(5deg); } }\n\n.clock { display: inline-flex; align-items: center; gap: 2px; margin-right: -8px; color: var(--graphite-2); font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }\n.clock.no-time #clock { display: none; }\n.clock .icon-btn { width: 36px; height: 36px; }\n.clock .i { width: 16px; height: 16px; }\n\n/* Rulers */\n.ruler { display: grid; color: var(--pencil); font-size: 10.5px; font-weight: 650; line-height: 1; user-select: none; -webkit-user-select: none; }\n.ruler-top { grid-area: 2 / 2; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--fi); padding: 0 var(--fo) 3px; }\n.ruler-left { grid-area: 3 / 1; grid-template-rows: repeat(3, minmax(0, 1fr)); row-gap: var(--fi); padding: var(--fo) 4px var(--fo) 0; }\n.ruler .grp { position: relative; display: grid; }\n.ruler-top .grp { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 1px; }\n.ruler-left .grp { grid-template-rows: repeat(3, minmax(0, 1fr)); row-gap: 1px; }\n.ruler span { display: grid; place-items: center; border-radius: 4px; transition: background-color .15s, color .15s; }\n.ruler span.on { background: var(--hl); color: var(--hl-ink); font-weight: 850; }\n.ruler-top .grp + .grp::before {\n  content: \"\"; position: absolute; left: calc(var(--fi) / -2 - .5px); bottom: -3px;\n  width: 1px; height: 7px; background: var(--pencil); opacity: .55;\n}\n.ruler-left .grp + .grp::before {\n  content: \"\"; position: absolute; top: calc(var(--fi) / -2 - .5px); right: -4px;\n  width: 7px; height: 1px; background: var(--pencil); opacity: .55;\n}\nhtml.no-rulers .ruler { visibility: hidden; }\n\n/* ==========================================================================\n   Board\n   ========================================================================== */\n.board-wrap { grid-area: 3 / 2; position: relative; width: var(--board); height: var(--board); }\n.board {\n  width: 100%; height: 100%;\n  display: grid; grid-template: repeat(3, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr));\n  gap: var(--fi); padding: var(--fo);\n  background: var(--frame); border-radius: 10px;\n  container-type: inline-size;\n  user-select: none; -webkit-user-select: none;\n  transition: filter .2s;\n}\n.box { display: grid; grid-template: repeat(3, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); overflow: hidden; }\n.box:nth-child(1) { border-top-left-radius: 7px; }\n.box:nth-child(3) { border-top-right-radius: 7px; }\n.box:nth-child(7) { border-bottom-left-radius: 7px; }\n.box:nth-child(9) { border-bottom-right-radius: 7px; }\n\n.cell {\n  position: relative; display: grid; place-items: center;\n  min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; border-radius: 0;\n  background: var(--sheet); color: var(--graphite);\n  cursor: pointer; outline: none; -webkit-appearance: none; appearance: none;\n  transition: background-color .12s;\n}\n@media (hover: hover) { .cell:hover { background: var(--sheet-2); } }\n.cell .v {\n  position: relative; z-index: 2;\n  font-size: 24px; font-size: 6.5cqi; line-height: 1; font-weight: 560;\n  font-variant-numeric: lining-nums tabular-nums;\n}\n.cell.user .v, .cell.wrong .v, .cell.hinted .v, .cell.revealed .v { font-weight: 640; font-variation-settings: var(--casual); }\n.cell.user .v { color: var(--pen); }\n.cell.hinted .v { color: var(--green); }\n.cell.wrong .v { color: var(--red); }\n.cell.revealed .v { color: var(--pencil); font-weight: 480; }\n\n/* Highlight layers, weakest first */\n.cell.peer { background: var(--peer); }\n.cell.zone { background: var(--green-soft); }\n.cell.wrong { background: var(--red-soft); }\n.cell.selected { background: var(--hl); }\n.cell.selected.wrong { background: var(--red-soft); }\n.cell.selected::before {\n  content: \"\"; position: absolute; inset: 0; z-index: 3; pointer-events: none;\n  box-shadow: inset 0 0 0 2px var(--hl-ring);\n}\n/* Matching numbers get a highlighter swipe behind the digit */\n.cell.same .v::before {\n  content: \"\"; position: absolute; z-index: -1; left: -30%; right: -30%; top: 14%; bottom: 2%;\n  background: var(--hl-soft); border-radius: 2px 7px 3px 8px; transform: rotate(-4deg);\n}\n/* Circled in red: the number a mistake collides with. Circled in green: the hint. */\n.cell.clash::after, .cell.target::after {\n  content: \"\"; position: absolute; inset: 9%; z-index: 3; pointer-events: none;\n  border: 2px solid var(--red); border-radius: 50%;\n}\n.cell.target::after { border-color: var(--green); animation: ring-in .45s cubic-bezier(.2, .8, .2, 1); }\n@keyframes ring-in { from { opacity: 0; transform: scale(1.6) rotate(-25deg); } to { opacity: 1; transform: none; } }\n\n.notes {\n  position: absolute; inset: 5%; z-index: 2; pointer-events: none;\n  display: grid; grid-template: repeat(3, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr));\n}\n.notes i {\n  display: grid; place-items: center; font-style: normal;\n  font-size: 9px; font-size: 2.5cqi; line-height: 1; font-weight: 600; color: var(--pencil);\n  visibility: hidden;\n}\n.notes i.on { visibility: visib h d=\"M12 20H3\"/><path d=\"M14 2v4\"/><path d=\"M8 10v4\"/><path d=\"M16 18v4\"/><\/g><\/symbol>\n  <symbol id=\"i-sun\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2\"/><path d=\"M12 20v2\"/><path d=\"m4.93 4.93 1.41 1.41\"/><path d=\"m17.66 17.66 1.41 1.41\"/><path d=\"M2 12h2\"/><path d=\"M20 12h2\"/><path d=\"m6.34 17.66-1.41 1.41\"/><path d=\"m19.07 4.93-1.41 1.41\"/><\/g><\/symbol>\n  <symbol id=\"i-moon\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"/><\/symbol>\n  <symbol id=\"i-pause\" viewBox=\"0 0 24 24\"><g fill=\"currentColor\"><rect x=\"6\" y=\"4.5\" width=\"4\" height=\"15\" rx=\"1.2\"/><rect x=\"14\" y=\"4.5\" width=\"4\" height=\"15\" rx=\"1.2\"/><\/g><\/symbol>\n  <symbol id=\"i-play\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8Z\"/><\/symbol>\n  <symbol id=\"i-x\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M18 6 6 18\"/><path d=\"m6 6 12 12\"/><\/g><\/symbol>\n  <symbol id=\"i-chev\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/><\/symbol>\n  <symbol id=\"i-restart\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\/g><\/symbol>\n  <symbol id=\"i-target\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M12 1.5v3.5\"/><path d=\"M12 19v3.5\"/><path d=\"M1.5 12H5\"/><path d=\"M19 12h3.5\"/><\/g><\/symbol>\n  <symbol id=\"i-info\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4\"/><path d=\"M12 8h.01\"/><\/g><\/symbol>\n  <symbol id=\"i-check\" viewBox=\"0 0 24 24\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M20 6 9 17l-5-5\"/><\/symbol>\n  <symbol id=\"i-heart-crack\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/><path d=\"m12 13-1-1 2-2-3-3 2-2\"/><\/g><\/symbol>\n<\/svg>\n\n<div class=\"app\">\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <a class=\"icon-btn back\" href=\"../../index.html\" aria-label=\"All games\" title=\"All games\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-back\"/><\/svg><\/a>\n      <span class=\"mark\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n      <h1 class=\"wordmark\">Sudoku<\/h1>\n    <\/div>\n    <nav class=\"actions\" aria-label=\"Game menu\">\n      <button type=\"button\" class=\"btn-new\" id=\"btnNew\" aria-label=\"New game\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"/><\/svg><span>New game<\/span><\/button>\n      <button type=\"button\" class=\"icon-btn\" id=\"btnRules\" aria-label=\"How to play\" title=\"How to play\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-help\"/><\/svg><\/button>\n      <button type=\"button\" class=\"icon-btn\" id=\"btnStats\" aria-label=\"Statistics\" title=\"Statistics\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-chart\"/><\/svg><\/button>\n      <button type=\"button\" class=\"icon-btn\" id=\"btnTheme\" aria-label=\"Switch to dark theme\" title=\"Switch theme\"><svg class=\"i\" aria-hidden=\"true\"><use id=\"themeIcon\" href=\"#i-moon\"/><\/svg><\/button>\n      <button type=\"button\" class=\"icon-btn\" id=\"btnSettings\" aria-label=\"Settings\" title=\"Settings\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-sliders\"/><\/svg><\/button>\n    <\/nav>\n  <\/header>\n\n  <main class=\"stage\">\n    <section class=\"board-frame\" id=\"boardFrame\" aria-label=\"Puzzle\">\n      <div class=\"statusbar\">\n        <button type=\"button\" class=\"level\" id=\"btnLevel\" aria-haspopup=\"dialog\" title=\"Change difficulty\">\n          <span class=\"meter\" id=\"levelMeter\" data-rank=\"2\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n          <span id=\"levelName\">Medium<\/span>\n          <svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-chev\"/><\/svg>\n        <\/button>\n        <div class=\"hearts\" id=\"hearts\" role=\"img\" aria-label=\"3 of 3 lifelines left\" title=\"Lifelines: every mistake costs one\"><\/div>\n        <div class=\"clock\" id=\"clockWrap\">\n          <span id=\"clock\" aria-label=\"Elapsed time\">00:00<\/span>\n          <button type=\"button\" class=\"icon-btn\" id=\"btnPause\" aria-label=\"Pause\"><svg class=\"i\" aria-hidden=\"true\"><use id=\"pauseIcon\" href=\"#i-pause\"/><\/svg><\/button>\n        <\/div>\n      <\/div>\n      <div class=\"ruler ruler-top\" id=\"rulerTop\" aria-hidden=\"true\"><\/div>\n      <div class=\"ruler ruler-left\" id=\"rulerLeft\" aria-hidden=\"true\"><\/div>\n      <div class=\"board-wrap is-busy\" id=\"boardWrap\">\n        <div class=\"board\" id=\"board\" role=\"group\" aria-label=\"Sudoku board. Use arrow keys to move and 1 to 9 to fill a cell.\"><\/div>\n        <div class=\"overlay ov-pause\" id=\"ovPause\">\n          <p class=\"ov-title\">Paused<\/p>\n          <p class=\"ov-text\">The clock stops while the board is hidden.<\/p>\n          <button type=\"button\" class=\"btn btn-primary\" id=\"btnResume\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-play\"/><\/svg>Resume<\/button>\n        <\/div>\n        <div class=\"overlay ov-busy\" aria-live=\"polite\">\n          <div class=\"loader\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n          <p class=\"ov-text\" id=\"busyText\">Building a puzzle with exactly one solution.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"controls\" aria-label=\"Controls\">\n      <div class=\"coach\" id=\"coach\" data-kind=\"progress\">\n        <svg class=\"i coach-i\" aria-hidden=\"true\"><use id=\"coachIcon\" href=\"#i-target\"/><\/svg>\n        <div class=\"coach-body\">\n          <p class=\"coach-title\" id=\"coachTitle\">Getting the board ready<\/p>\n          <p class=\"coach-text\" id=\"coachText\"><\/p>\n          <div class=\"ticks\" id=\"ticks\" aria-hidden=\"true\"><div class=\"ticks-fill\"><\/div><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"tools\">\n        <button type=\"button\" class=\"tool\" id=\"btnUndo\"><span class=\"ti\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-undo\"/><\/svg><\/span><span>Undo<\/span><\/button>\n        <button type=\"button\" class=\"tool\" id=\"btnErase\"><span class=\"ti\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-erase\"/><\/svg><\/span><span>Erase<\/span><\/button>\n        <button type=\"button\" class=\"tool\" id=\"btnNotes\" aria-pressed=\"false\"><span class=\"ti\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-pencil\"/><\/svg><\/span><span id=\"notesLabel\">Notes<\/span><\/button>\n        <button type=\"button\" class=\"tool\" id=\"btnHint\"><span class=\"ti\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-bulb\"/><\/svg><span class=\"count\" id=\"hintCount\">3<\/span><\/span><span>Hint<\/span><\/button>\n      <\/div>\n\n      <div class=\"numpad\" id=\"numpad\"><\/div>\n\n      <dl class=\"legend\" aria-label=\"Keyboard shortcuts\">\n        <dt>Arrow keys<\/dt><dd>Move around the board<\/dd>\n        <dt><kbd>1<\/kbd> to <kbd>9<\/kbd><\/dt><dd>Fill the selected cell<\/dd>\n        <dt><kbd>Shift<\/kbd> + <kbd>1<\/kbd> to <kbd>9<\/kbd><\/dt><dd>Add or remove a note<\/dd>\n        <dt><kbd>Backspace<\/kbd><\/dt><dd>Erase<\/dd>\n        <dt><kbd>N<\/kbd> <kbd>H<\/kbd> <kbd>U<\/kbd> <kbd>P<\/kbd><\/dt><dd>Notes, hint, undo, pause<\/dd>\n      <\/dl>\n    <\/section>\n  <\/main>\n<\/div>\n\n<dialog id=\"dlgNew\" aria-labelledby=\"dlgNewTitle\">\n  <div class=\"sheet\">\n    <div class=\"sheet-h\">\n      <h2 id=\"dlgNewTitle\">New game<\/h2>\n      <button type=\"button\" class=\"icon-btn\" data-close aria-label=\"Close\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-x\"/><\/svg><\/button>\n    <\/div>\n    <p class=\"sheet-p\">Pick a level. Each puzzle is generated on the spot, checked to have exactly one solution, and graded by the techniques it needs.<\/p>\n    <div class=\"levels\" id=\"levels\"><\/div>\n    <div class=\"sheet-foot\">\n      <button type=\"button\" class=\"btn btn-quiet\" id=\"btnRestart\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-restart\"/><\/svg>Restart this puzzle<\/button>\n    <\/div>\n  <\/div>\n<\/dialog>\n\n<dialog id=\"dlgRules\" aria-labelledby=\"dlgRulesTitle\">\n  <div class=\"sheet\">\n    <div class=\"sheet-h\">\n      <h2 id=\"dlgRulesTitle\">How to play<\/h2>\n      <button type=\"button\" class=\"icon-btn\" data-close aria-label=\"Close\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-x\"/><\/svg><\/button>\n    <\/div>\n    <div class=\"rules\">\n      <p>Fill every empty cell with a digit from 1 to 9 so that:<\/p>\n      <ul>\n        <li>each <b>row<\/b> contains 1 to 9 exactly once,<\/li>\n        <li>each <b>column<\/b> contains 1 to 9 exactly once,<\/li>\n        <li>each of the nine <b>3×3 boxes<\/b> contains 1 to 9 exactly once.<\/li>\n      <\/ul>\n      <p>Every puzzle is generated on the spot and proven to have exactly one solution, so logic always wins and guessing is never needed.<\/p>\n      <p><b>Lifelines.<\/b> A wrong number costs one of your three hearts. Lose all three and the puzzle is over, but you can retry it.<\/p>\n      <p><b>Hints.<\/b> You get three per puzzle. Each one fills a cell and explains why it must hold that number. Select a cell first to ask about that cell.<\/p>\n      <p class=\"tip\">Notes let you pencil in candidates. Placing a number clears it from notes in the same row, column and box.<\/p>\n    <\/div>\n    <div class=\"btn-row\"><button type=\"button\" class=\"btn btn-primary wide\" data-close>Play<\/button><\/div>\n  <\/div>\n<\/dialog>\n\n<dialog id=\"dlgSettings\" aria-labelledby=\"dlgSetTitle\">\n  <div class=\"sheet\">\n    <div class=\"sheet-h\">\n      <h2 id=\"dlgSetTitle\">Settings<\/h2>\n      <button type=\"button\" class=\"icon-btn\" data-close aria-label=\"Close\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-x\"/><\/svg><\/button>\n    <\/div>\n    <div class=\"set-row\">\n      <span><b>Theme<\/b><small>Auto follows your device.<\/small><\/span>\n      <div class=\"seg\" role=\"group\" aria-label=\"Theme\">\n        <button type=\"button\" data-theme-opt=\"auto\">Auto<\/button>\n        <button type=\"button\" data-theme-opt=\"light\">Light<\/button>\n        <button type=\"button\" data-theme-opt=\"dark\">Dark<\/button>\n      <\/div>\n    <\/div>\n    <label class=\"set-row\"><span><b>Highlight row, column and box<\/b><small>Shade the cells that share a unit with the selected cell.<\/small><\/span><input type=\"checkbox\" class=\"switch\" role=\"switch\" data-setting=\"highlightPeers\"><\/label>\n    <label class=\"set-row\"><span><b>Highlight matching numbers<\/b><small>Mark every copy of the selected number, notes included.<\/small><\/span><input type=\"checkbox\" class=\"switch\" role=\"switch\" data-setting=\"highlightSame\"><\/label>\n    <label class=\"set-row\"><span><b>Clear notes automatically<\/b><small>Placing a number removes it from notes in the same row, column and box.<\/small><\/span><input type=\"checkbox\" class=\"switch\" role=\"switch\" data-setting=\"autoNotes\"><\/label>\n    <label class=\"set-row\"><span><b>Show coordinates<\/b><small>Row letters and column numbers around the board. Hints and mistakes refer to them.<\/small><\/span><input type=\"checkbox\" class=\"switch\" role=\"switch\" data-setting=\"showRulers\"><\/label>\n    <label class=\"set-row\"><span><b>Show timer<\/b><\/span><input type=\"checkbox\" class=\"switch\" role=\"switch\" data-setting=\"showTimer\"><\/label>\n    <label class=\"set-row\"><span><b>Sound effects<\/b><\/span><input type=\"checkbox\" class=\"switch\" role=\"switch\" data-setting=\"sound\"><\/label>\n  <\/div>\n<\/dialog>\n\n<dialog id=\"dlgStats\" aria-labelledby=\"dlgStatsTitle\">\n  <div class=\"sheet\">\n    <div class=\"sheet-h\">\n      <h2 id=\"dlgStatsTitle\">Statistics<\/h2>\n      <button type=\"button\" class=\"icon-btn\" data-close aria-label=\"Close\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-x\"/><\/svg><\/button>\n    <\/div>\n    <div class=\"seg wide\" role=\"group\" aria-label=\"Level\" id=\"statsSeg\">\n      <button type=\"button\" data-stats-level=\"easy\">Easy<\/button>\n      <button type=\"button\" data-stats-level=\"medium\">Medium<\/button>\n      <button type=\"button\" data-stats-level=\"hard\">Hard<\/button>\n      <button type=\"button\" data-stats-level=\"expert\">Expert<\/button>\n    <\/div>\n    <div class=\"stats-grid\" id=\"statsGrid\"><\/div>\n    <div class=\"sheet-foot\">\n      <button type=\"button\" class=\"btn btn-quiet btn-danger\" id=\"btnResetStats\">Reset statistics<\/button>\n    <\/div>\n  <\/div>\n<\/dialog>\n\n<dialog id=\"dlgEnd\" aria-labelledby=\"endTitle\">\n  <div class=\"sheet end\" id=\"endSheet\"><\/div>\n<\/dialog>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<div class=\"sr-only\" id=\"sr\" aria-live=\"assertive\"><\/div>\n<noscript><p style=\"text-align:center;padding:24px\">This Sudoku needs JavaScript to run.<\/p><\/noscript>\n<script>\n(() => {\n'use strict';\n\n/* =============================================================================\n   Rules you can change\n   ============================================================================= */\nconst MAX_LIVES = 3;   // lifelines: each wrong number costs one\nconst MAX_HINTS = 3;   // hints per puzzle\n\n// tech: the hardest technique a puzzle may need, as [min, max]\n//   1 singles · 2 locked candidates · 3 pairs · 4 triples and X-wings · 5 beyond\nconst LEVELS = {\n  easy:   { name: 'Easy',   rank: 1, clues: 40, tech: [1, 1], budget: 700,  desc: 'About 40 clues. Every step is a single.' },\n  medium: { name: 'Medium', rank: 2, clues: 32, tech: [1, 1], budget: 1200, desc: 'About 32 clues. Still singles, but well hidden.' },\n  hard:   { name: 'Hard',   rank: 3, clues: 27, tech: [2, 3], budget: 2000, desc: 'About 27 clues. Needs candidate eliminations.' },\n  expert: { name: 'Expert', rank: 4, clues: 23, tech: [3, 4], budget: 3000, desc: 'About 24 clues. Needs pairs, triples or X‑wings.' },\n};\n\n/* =============================================================================\n   Grid geometry\n   ============================================================================= */\nconst ROW = [], COL = [], BOX = [];\nfor (let i = 0; i < 81; i++) {\n  ROW[i] = (i / 9) | 0;\n  COL[i] = i % 9;\n  BOX[i] = ((ROW[i] / 3) | 0) * 3 + ((COL[i] / 3) | 0);\n}\nconst ROWS = [], COLS = [], BOXES = [];\nfor (let u = 0; u < 9; u++) { ROWS.push([]); COLS.push([]); BOXES.push([]); }\nfor (let i = 0; i < 81; i++) { ROWS[ROW[i]].push(i); COLS[COL[i]].push(i); BOXES[BOX[i]].push(i); }\nconst UNITS = ROWS.concat(COLS, BOXES);           // 0-8 rows, 9-17 columns, 18-26 boxes\nconst PEERS = [];\nfor (let i = 0; i < 81; i++) {\n  const s = new Set(ROWS[ROW[i]].concat(COLS[COL[i]], BOXES[BOX[i]]));\n  s.delete(i);\n  PEERS.push(Array.from(s));\n}\nconst ALL = 0x3fe;                                 // bits 1..9\nconst ROW_NAMES = 'ABCDEFGHI';\nconst BOX_NAMES = ['top-left', 'top-middle', 'top-right', 'middle-left', 'center', 'middle-right', 'bottom-left', 'bottom-middle', 'bottom-right'];\n\nconst popcount = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };\nconst lowBit = m => 31 - Math.clz32(m & -m);\nconst digitsOf = m => { const a = []; for (let d = 1; d <= 9; d++) if (m & (1 << d)) a.push(d); return a; };\nconst range = n => Array.from({ length: n }, (_, i) => i);\nconst shuffle = a => {\n  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }\n  return a;\n};\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\n/* =============================================================================\n   Exact solver (bitmasks, fewest-candidates-first). Used to build full grids and\n   to prove a puzzle has exactly one solution.\n   ============================================================================= */\nfunction search(grid, limit, randomize, onSolved) {\n  const g = Array.from(grid);\n  const rows = new Uint16Array(9), cols = new Uint16Array(9), boxes = new Uint16Array(9);\n  for (let i = 0; i < 81; i++) {\n    const v = g[i];\n    if (!v) continue;\n    const b = 1 << v;\n    if ((rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & b) return 0;\n    rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b;\n  }\n  let found = 0;\n  const step = () => {\n    let best = -1, bestMask = 0, bestN = 10;\n    for (let i = 0; i < 81; i++) {\n      if (g[i]) continue;\n      const m = ALL & ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]);\n      const n = popcount(m);\n      if (n < bestN) { best = i; bestMask = m; bestN = n; if (n < 2) break; }\n    }\n    if (best < 0) { found++; if (onSolved) onSolved(g); return found >= limit; }\n    if (bestN === 0) return false;\n    const r = ROW[best], c = COL[best], x = BOX[best];\n    const order = randomize ? shuffle(digitsOf(bestMask)) : null;\n    let m = bestMask;\n    for (let k = 0; ; k++) {\n      let d;\n      if (order) { if (k >= order.length) break; d = order[k]; }\n      else { if (!m) break; const lb = m & -m; m ^= lb; d = 31 - Math.clz32(lb); }\n      const b = 1 << d;\n      g[best] = d; rows[r] |= b; cols[c] |= b; boxes[x] |= b;\n      if (step()) return true;\n      rows[r] ^= b; cols[c] ^= b; boxes[x] ^= b;\n    }\n    g[best] = 0;\n    return false;\n  };\n  step();\n  return found;\n}\nconst countSolutions = (grid, limit = 2) => search(grid, limit, false);\nconst solve = grid => { let out = null; search(grid, 1, false, g => { out = g.slice(); }); return out; };\nconst randomSolution = () => { let out = null; search(new Array(81).fill(0), 1, true, g => { out = g.slice(); }); return out; };\n\n// Remove clues in symmetric pairs, keeping the solution unique at every step.\nfunction dig(solution, target) {\n  const p = solution.slice();\n  let clues = 81;\n  for (const i of shuffle(range(41))) {\n    if (clues <= target) break;\n    const pair = i === 40 ? [40] : [i, 80 - i];\n    const keep = pair.map(k => p[k]);\n    pair.forEach(k => { p[k] = 0; });\n    if (countSolutions(p) === 1) clues -= pair.length;\n    else pair.forEach((k, n) => { p[k] = keep[n]; });\n  }\n  if (clues > target) {                // still too many: try single cells\n    for (const i of shuffle(range(81))) {\n      if (clues <= target) break;\n      if (!p[i]) continue;\n      const v = p[i];\n      p[i] = 0;\n      if (countSolutions(p) === 1) clues--; else p[i] = v;\n    }\n  }\n  return { puzzle: p, clues };\n}\n\n/* =============================================================================\n   Human techniques. These grade puzzles and power the explained hints.\n   ============================================================================= */\nfunction makeCands(g) {\n  const cand = new Uint16Array(81);\n  for (let i = 0; i < 81; i++) {\n    if (g[i]) continue;\n    let used = 0;\n    for (const p of PEERS[i]) if (g[p]) used |= 1 << g[p];\n    cand[i] = ALL & ~used;\n  }\n  return cand;\n}\nfunction assign(g, cand, i, d) {\n  g[i] = d; cand[i] = 0;\n  const m = ~(1 << d);\n  for (const p of PEERS[i]) cand[p] &= m;\n}\nfunction singles(g, cand) {\n  const hidden = [], naked = [];\n  for (let u = 0; u < 27; u++) {\n    const unit = UNITS[u];\n    let placed = 0;\n    for (const i of unit) if (g[i]) placed |= 1 << g[i];\n    for (let d = 1; d <= 9; d++) {\n      const b = 1 << d;\n      if (placed & b) continue;\n      let at = -1, n = 0;\n      for (const i of unit) if (!g[i] && (cand[i] & b)) { at = i; if (++n > 1) break; }\n      if (n === 1) hidden.push({ i: at, d, u });\n    }\n  }\n  for (let i = 0; i < 81; i++) if (!g[i] && popcount(cand[i]) === 1) naked.push({ i, d: lowBit(cand[i]) });\n  return { hidden, naked };\n}\nfunction combos(arr, k, fn, start = 0, acc = []) {\n  if (acc.length === k) { fn(acc); return; }\n  for (let i = start; i < arr.length; i++) { acc.push(arr[i]); combos(arr, k, fn, i + 1, acc); acc.pop(); }\n}\n// Pointing and claiming\nfunction locked(g, cand) {\n  let changed = false;\n  for (let b = 0; b < 9; b++) {\n    for (let d = 1; d <= 9; d++) {\n      const bit = 1 << d;\n      let rm = 0, cm = 0, n = 0;\n      for (const i of BOXES[b]) if (!g[i] && (cand[i] & bit)) { rm |= 1 << ROW[i]; cm |= 1 << COL[i]; n++; }\n      if (n < 2) continue;\n      if (popcount(rm) === 1) for (const i of ROWS[lowBit(rm)]) if (BOX[i] !== b && !g[i] && (cand[i] & bit)) { cand[i] &= ~bit; changed = true; }\n      if (popcount(cm) === 1) for (const i of COLS[lowBit(cm)]) if (BOX[i] !== b && !g[i] && (cand[i] & bit)) { cand[i] &= ~bit; changed = true; }\n    }\n  }\n  for (let u = 0; u < 18; u++) {\n    for (let d = 1; d <= 9; d++) {\n      const bit = 1 << d;\n      let bm = 0, n = 0;\n      for (const i of UNITS[u]) if (!g[i] && (cand[i] & bit)) { bm |= 1 << BOX[i]; n++; }\n      if (n < 2 || popcount(bm) !== 1) continue;\n      for (const i of BOXES[lowBit(bm)]) {\n        const inLine = u < 9 ? ROW[i] === u : COL[i] === u - 9;\n        if (!inLine && !g[i] && (cand[i] & bit)) { cand[i] &= ~bit; changed = true; }\n      }\n    }\n  }\n  return changed;\n}\nfunction nakedSet(g, cand, k) {\n  let changed = false;\n  for (const unit of UNITS) {\n    const open = unit.filter(i => !g[i]);\n    if (open.length <= k) continue;\n    const pool = open.filter(i => popcount(cand[i]) <= k);\n    if (pool.length < k) continue;\n    combos(pool, k, set => {\n      let mask = 0;\n      for (const i of set) mask |= cand[i];\n      if (popcount(mask) !== k) return;\n      for (const i of open) if (!set.includes(i) && (cand[i] & mask)) { cand[i] &= ~mask; changed = true; }\n    });\n  }\n  return changed;\n}\nfunction hiddenSet(g, cand, k) {\n  let changed = false;\n  for (const unit of UNITS) {\n    if (unit.filter(i => !g[i]).length <= k) continue;\n    const ds = [], where = [];\n    for (let d = 1; d <= 9; d++) {\n      let m = 0;\n      unit.forEach((i, p) => { if (!g[i] && (cand[i] & (1 << d))) m |= 1 << p; });\n      const n = popcount(m);\n      if (n >= 2 && n <= k) { ds.push(d); where[d] = m; }\n    }\n    if (ds.length < k) continue;\n    combos(ds, k, set => {\n      let pos = 0, keep = 0;\n      for (const d of set) { pos |= where[d]; keep |= 1 << d; }\n      if (popcount(pos) !== k) return;\n      unit.forEach((i, p) => {\n        if ((pos & (1 << p)) && (cand[i] & ~keep)) { cand[i] &= keep; changed = true; }\n      });\n    });\n  }\n  return changed;\n}\nfunction xWing(g, cand) {\n  let changed = false;\n  for (let d = 1; d <= 9; d++) {\n    const bit = 1 << d;\n    for (const [lines, cross, lineOf, crossOf] of [[ROWS, COLS, ROW, COL], [COLS, ROWS, COL, ROW]]) {\n      const masks = lines.map(line => { let m = 0; for (const i of line) if (!g[i] && (cand[i] & bit)) m |= 1 << crossOf[i]; return m; });\n      for (let a = 0; a < 9; a++) {\n        if (popcount(masks[a]) !== 2) continue;\n        for (let b = a + 1; b < 9; b++) {\n          if (masks[b] !== masks[a]) continue;\n          let m = masks[a];\n          while (m) {\n            const cb = m & -m; m ^= cb;\n            for (const i of cross[31 - Math.clz32(cb)]) {\n              const li = lineOf[i];\n              if (li === a || li === b) continue;\n              if (!g[i] && (cand[i] & bit)) { cand[i] &= ~bit; changed = true; }\n            }\n          }\n        }\n      }\n    }\n  }\n  return changed;\n}\nfunction eliminate(g, cand, tier) {\n  if (tier === 2) return locked(g, cand);\n  if (tier === 3) return nakedSet(g, cand, 2) || hiddenSet(g, cand, 2);\n  return nakedSet(g, cand, 3) || hiddenSet(g, cand, 3) || xWing(g, cand);\n}\n// Returns the hardest technique tier needed: 1-4, or 5 if these techniques get stuck.\nfunction grade(puzzle) {\n  const g = Array.from(puzzle), cand = makeCands(g);\n  let level = 0;\n  for (let guard = 0; guard < 600; guard++) {\n    if (g.indexOf(0) < 0) return Math.max(level, 1);\n    const { hidden, naked } = singles(g, cand);\n    if (hidden.length || naked.length) {\n      level = Math.max(level, 1);\n      for (const s of naked.concat(hidden)) if (!g[s.i] && (cand[s.i] & (1 << s.d))) assign(g, cand, s.i, s.d);\n      continue;\n    }\n    let tier = 0;\n    for (let t = 2; t <= 4 && !tier; t++) if (eliminate(g, cand, t)) tier = t;\n    if (!tier) return 5;\n    level = Math.max(level, tier);\n  }\n  return 5;\n}\n\n/* =============================================================================\n   Generator\n   ============================================================================= */\nasync function generate(levelKey) {\n  const L = LEVELS[levelKey];\n  const t0 = performance.now();\n  let best = null;\n  for (;;) {\n    const solution = randomSolution();\n    const { puzzle, clues } = dig(solution, L.clues);\n    const tech = grade(puzzle);\n    const miss = tech < L.tech[0] ? L.tech[0] - tech : tech > L.tech[1] ? tech - L.tech[1] : 0;\n    if (!best || miss < best.miss) best = { puzzle, solution, clues, tech, miss };\n    if (!miss || performance.now() - t0 > L.budget) break;\n    await sleep(0);                    // let the page breathe between attempts\n  }\n  return best;\n}\n\n/* =============================================================================\n   Hint finder: the easiest logical step, explained\n   ============================================================================= */\nfunction findHint(values, solution, target, near) {\n  const g = values.map((v, i) => (v && v === solution[i] ? v : 0));\n  const cand = makeCands(g);\n  const dist = s => (near < 0 ? 0 : Math.abs(ROW[s.i] - ROW[near]) + Math.abs(COL[s.i] - COL[near]));\n  const pick = list => {\n    if (!list.length) return null;\n    if (near < 0) return list[Math.floor(Math.random() * list.length)];\n    return list.reduce((a, b) => (dist(b) < dist(a) ? b : a));\n  };\n  const make = (s, kind) => ({\n    i: s.i, d: solution[s.i], u: s.u === undefined ? -1 : s.u, targeted: target >= 0,\n    kind: s.d && s.d !== solution[s.i] ? 'reveal' : kind,\n  });\n  const singleAt = i => {\n    const { hidden, naked } = singles(g, cand);\n    const h = hidden.filter(s => s.i === i).sort((a, b) => b.u - a.u)[0];\n    if (h) return [h, 'hidden'];\n    const n = naked.find(s => s.i === i);\n    return n ? [n, 'naked'] : null;\n  };\n  const deeper = test => {\n    for (let guard = 0; guard < 80; guard++) {\n      let changed = false;\n      for (let t = 2; t <= 4 && !changed; t++) changed = eliminate(g, cand, t);\n      if (!changed) return null;\n      const r = test();\n      if (r) return r;\n    }\n    return null;\n  };\n\n  // Fill by logic until cell i is placed. Returns the hardest elimination tier\n  // that was needed (0 means singles were enough) or -1 if logic stalls.\n  const solveUntil = i => {\n    let tier = 0;\n    for (let guard = 0; guard < .i] = 0;\n  S.hinted[h.i] = true;\n  S.hintsLeft--;\n  S.hintsUsed++;\n  S.history = S.history.filter(e => e.i !== h.i);\n  if (settings.autoNotes) {\n    const b = 1 << h.d;\n    for (const p of PEERS[h.i]) S.notes[p] &= ~b;\n  }\n\n  ui.sel = h.i;\n  const zone = h.kind === 'hidden' ? UNITS[h.u] : h.kind === 'naked' ? PEERS[h.i] : [];\n  ui.focus = { i: h.i, zone: new Set(zone) };\n  clearTimeout(focusTimer);\n  focusTimer = setTimeout(() => { ui.focus = null; renderBoard(); }, 7000);\n\n  const at = cellName(h.i);\n  let title = `Hint for ${at}`, text;\n  if (h.kind === 'hidden') text = `${unitName(h.u)} needs a ${h.d}, and this is the only open cell that can take it.`;\n  else if (h.kind === 'naked') text = `Every other number already sits in this cell's row, column or box, so only ${h.d} fits.`;\n  else if (h.kind === 'later') text = `This cell isn't forced yet. Fill in the cells that are, and it follows: ${h.d}.`;\n  else if (h.kind === 'advanced') text = h.targeted\n    ? `Scanning alone doesn't force this cell. Ruling out candidates with pairs and pointing leaves ${h.d}.`\n    : `No single is showing yet. Ruling out candidates with pairs and pointing leaves only ${h.d} here.`;\n  else { title = `Answer for ${at}`; text = `Logic can't pin this cell down from here yet, so here is the answer: ${h.d}.`; }\n  if (wasWrong) text = `The ${prev} here was wrong. ${text}`;\n  showCoach('hint', title, `${text} ${plural(S.hintsLeft, 'hint')} left.`, 12000);\n\n  replay(cells[h.i].v, 'ink', 300);\n  sfx.hint();\n  announce(`Hint: ${cellSpoken(h.i)} is ${h.d}. ${text}`);\n  const done = completedUnits(h.i);\n  if (done.length) done.forEach(u => sweep(UNITS[u], h.i, 45));\n  if (isSolved()) { finishWin(); return; }\n  persist();\n  render();\n  cells[h.i].el.focus({ preventScroll: true });\n}\n\nfunction toggleNotesMode() {\n  if (!S || ui.busy || S.status !== 'playing') return;\n  ui.notes = !ui.notes;\n  renderChrome();\n  announce(ui.notes ? 'Notes on' : 'Notes off');\n}\n\nfunction setPaused(p) {\n  if (!S || S.status !== 'playing' || ui.busy) p = false;\n  if (ui.paused === p) return;\n  ui.paused = p;\n  if (p) persist();\n  render();\n  if (!p && ui.sel >= 0) cells[ui.sel].el.focus({ preventScroll: true });\n}\n\nfunction finishWin() {\n  S.status = 'won';\n  ui.sel = -1;\n  clearFocus(); clearCoach();\n  const st = stats[S.difficulty];\n  const firstWin = st.won === 0;\n  st.won++; st.total += S.elapsed; st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak);\n  const isBest = !st.best || S.elapsed < st.best;\n  if (isBest) st.best = S.elapsed;\n  saveStats();\n  persist();\n  render();\n  winSweep();\n  sfx.win();\n  buzz([30, 50, 30]);\n  announce(`Solved in ${spokenTime(S.elapsed)}.`);\n  setTimeout(() => openEnd(true, isBest ? (firstWin ? 'first' : 'best') : ''), reduced() ? 150 : 1400);\n}\n\nfunction finishLoss() {\n  S.status = 'lost';\n  ui.sel = -1;\n  clearFocus();\n  const st = stats[S.difficulty];\n  st.lost++; st.streak = 0;\n  saveStats();\n  persist();\n  render();\n  setTimeout(() => openEnd(false), 900);\n}\n\n/* =============================================================================\n   Saving and loading\n   ============================================================================= */\nfunction persist() {\n  if (!S) return;\n  store.set(KEYS.game, Object.assign({}, S, { history: S.history.slice(-250) }));\n}\nfunction validSolution(s) {\n  return UNITS.every(u => {\n    let m = 0;\n    for (const i of u) { const v = s[i]; if (!(v >= 1 && v <= 9)) return false; m |= 1 << v; }\n    return m === ALL;\n  });\n}\nfunction loadGame() {\n  const g = store.get(KEYS.game);\n  if (!g || g.v !== 1 || !LEVELS[g.difficulty]) return null;\n  const ok = ['puzzle', 'solution', 'values', 'notes', 'hinted'].every(k => Array.isArray(g[k]) && g[k].length === 81);\n  if (!ok || !validSolution(g.solution)) return null;\n  for (let i = 0; i < 81; i++) {\n    if (g.puzzle[i] && (g.puzzle[i] !== g.solution[i] || g.values[i] !== g.puzzle[i])) return null;\n    if (!(g.values[i] >= 0 && g.values[i] <= 9)) return null;\n  }\n  g.history = Array.isArray(g.history) ? g.history.filter(e => e && e.i >= 0 && e.i < 81 && Array.isArray(e.p)) : [];\n  g.lives = Math.max(0, Math.min(MAX_LIVES, g.lives | 0));\n  g.hintsLeft = Math.max(0, Math.min(MAX_HINTS, g.hintsLeft | 0));\n  g.elapsed = Math.max(0, +g.elapsed || 0);\n  return g;\n}\n\n/* =============================================================================\n   Dialogs\n   ============================================================================= */\nfunction openDialog(d) {\n  if (d.open) return;\n  try { d.showModal(); } catch (e) { d.setAttribute('open', ''); }\n}\nfunction openNewDialog() {\n  const cur = S ? S.difficulty : settings.level;\n  $('levels').innerHTML = Object.keys(LEVELS).map(k => {\n    const L = LEVELS[k], best = stats[k].best;\n    return `<button type=\"button\" class=\"lvl\" data-level=\"${k}\"${k === cur ? ' aria-current=\"true\"' : ''}>\n      <span class=\"meter\" data-rank=\"${L.rank}\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><\/span>\n      <span><span class=\"lvl-name\">${L.name}<\/span><span class=\"lvl-desc\">${L.desc}<\/span><\/span>\n      <span class=\"lvl-best\">${best ? 'Best ' + fmtTime(best) : ''}<\/span>\n    <\/button>`;\n  }).join('');\n  $('btnRestart').disabled = !S || ui.busy;\n  openDialog(dlgNew);\n}\n\nlet statsLevel = 'medium';\nfunction renderStats() {\n  const s = stats[statsLevel];\n  document.querySelectorAll('[data-stats-level]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.statsLevel === statsLevel)));\n  const finished = s.won + s.lost;\n  const tiles = [\n    [String(s.started), 'Games started'],\n    [String(s.won), 'Games won'],\n    [s.started ? Math.round((s.won / s.started) * 100) + '%' : '–', 'Win rate'],\n    [s.best ? fmtTime(s.best) : '–', 'Best time'],\n    [s.won ? fmtTime(s.total / s.won) : '–', 'Average win'],\n    [String(s.streak), `Win streak (best ${s.bestStreak})`],\n  ];\n  $('statsGrid').innerHTML = tiles.map(([v, l]) => `<div class=\"stat\"><b>${v}<\/b><span>${l}<\/span><\/div>`).join('');\n  $('statsGrid').setAttribute('aria-label', `${LEVELS[statsLevel].name}: ${finished} finished games`);\n}\n\nfunction openEnd(won, badge) {\n  if (!S) return;\n  const L = LEVELS[S.difficulty], st = stats[S.difficulty], lvl = L.name.toLowerCase();\n  const sheet = $('endSheet');\n  const close = `<button type=\"button\" class=\"icon-btn end-x\" data-close aria-label=\"Close\">${icon('i-x')}<\/button>`;\n  if (won) {\n    const badgeHTML = badge === 'first' ? `<p class=\"end-badge\">Your first ${lvl} win<\/p>`\n      : badge === 'best' ? '<p class=\"end-badge\">New best time<\/p>' : '';\n    sheet.innerHTML = `${close}\n      <div class=\"end-mark\">${icon('i-check', 'lg')}<\/div>\n      <h2 id=\"endTitle\">Solved<\/h2>\n      <p class=\"end-sub\">${L.name} puzzle, ${S.clues} clues<\/p>\n      <p class=\"end-time\">${fmtTime(S.elapsed)}<\/p>\n      ${badgeHTML}\n      <div class=\"end-facts\">\n        <div><b>${S.mistakes} of ${MAX_LIVES}<\/b><span>Lifelines used<\/span><\/div>\n        <div><b>${S.hintsUsed} of ${MAX_HINTS}<\/b><span>Hints used<\/span><\/div>\n        <div><b>${st.best ? fmtTime(st.best) : '–'}<\/b><span>Best ${lvl} time<\/span><\/div>\n      <\/div>\n      <div class=\"btn-row\">\n        <button type=\"button\" class=\"btn btn-quiet\" data-act=\"levels\">Change level<\/button>\n        <button type=\"button\" class=\"btn btn-primary\" data-act=\"again\" autofocus>New ${lvl} puzzle<\/button>\n      <\/div>`;\n  } else {\n    const left = toSolveCount() - solvedCount();\n    sheet.innerHTML = `${close}\n      <div class=\"end-mark lost\">${icon('i-heart-crack', 'lg')}<\/div>\n      <h2 id=\"endTitle\">Out of lifelines<\/h2>\n      <p class=\"end-sub\">${MAX_LIVES} wrong numbers with ${plural(left, 'cell')} still to fill. The same puzzle is ready for another try.<\/p>\n      <div class=\"btn-row\">\n        <button type=\"button\" class=\"btn btn-primary wide\" data-act=\"retry\" autofocus>${icon('i-restart')}Retry this puzzle<\/button>\n        <button type=\"button\" class=\"btn btn-quiet\" data-act=\"reveal\">Show solution<\/button>\n        <button type=\"button\" class=\"btn btn-quiet\" data-act=\"new\">New puzzle<\/button>\n      <\/div>`;\n  }\n  openDialog(dlgEnd);\n}\n\n/* =============================================================================\n   Theme and preferences\n   ============================================================================= */\nconst isDark = () => settings.theme === 'dark' || (settings.theme === 'auto' && !!mqDark && mqDark.matches);\nfunction applyTheme() {\n  const root = document.documentElement;\n  if (settings.theme === 'auto') root.removeAttribute('data-theme');\n  else root.setAttribute('data-theme', settings.theme);\n  const dark = isDark();\n  $('themeIcon').setAttribute('href', dark ? '#i-sun' : '#i-moon');\n  $('btnTheme').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');\n  $('metaTheme').setAttribute('content', dark ? '#11151C' : '#EEF1F5');\n  document.querySelectorAll('[data-theme-opt]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeOpt === settings.theme)));\n}\nfunction applyPrefs() {\n  document.documentElement.classList.toggle('no-rulers', !settings.showRulers);\n  clockWrap.classList.toggle('no-time', !settings.showTimer);\n}\nfunction syncSettingsForm() {\n  document.querySelectorAll('[data-setting]').forEach(inp => { inp.checked = !!settings[inp.dataset.setting]; });\n  applyTheme();\n}\n\n/* =============================================================================\n   Events\n   ============================================================================= */\nfunction bind() {\n  boardEl.addEventListener('pointerdown', e => {\n    const el = e.target.closest('.cell');\n    if (!el) return;\n    if (e.pointerType === 'mouse' && e.button !== 0) return;\n    select(+el.dataset.i, true);\n  });\n  boardEl.addEventListener('focusin', e => {\n    const el = e.target.closest('.cell');\n    if (el && canPlay() && +el.dataset.i !== ui.sel) select(+el.dataset.i, false);\n  });\n  numpadEl.addEventListener('click', e => {\n    const k = e.target.closest('.key');\n    if (k && !k.disabled) enterDigit(+k.dataset.d);\n  });\n  undoBtn.addEventListener('click', undo);\n  eraseBtn.addEventListener('click', erase);\n  notesBtn.addEventListener('click', toggleNotesMode);\n  hintBtn.addEventListener('click', useHint);\n  pauseBtn.addEventListener('click', () => setPaused(!ui.paused));\n  $('ovPause').addEventListener('click', () => setPaused(false));\n  $('btnNew').addEventListener('click', openNewDialog);\n  $('btnLevel').addEventListener('click', openNewDialog);\n  $('btnStats').addEventListener('click', () => { statsLevel = S ? S.difficulty : settings.level; renderStats(); openDialog(dlgStats); });\n  $('btnSettings').addEventListener('click', () => { syncSettingsForm(); openDialog(dlgSettings); });\n  $('btnRules').addEventListener('click', () => openDialog($('dlgRules')));\n  $('btnTheme').addEventListener('click', () => { settings.theme = isDark() ? 'light' : 'dark'; saveSettings(); applyTheme(); });\n\n  $('levels').addEventListener('click', e => {\n    const b = e.target.closest('[data-level]');\n    if (!b) return;\n    dlgNew.close();\n    newGame(b.dataset.level);\n  });\n  $('btnRestart').addEventListener('click', () => { dlgNew.close(); restartGame(); });\n\n  document.querySelectorAll('[data-setting]').forEach(inp => inp.addEventListener('change', () => {\n    settings[inp.dataset.setting] = inp.checked;\n    saveSettings();\n    applyPrefs();\n    resetCellCache();\n    render();\n  }));\n  document.querySelectorAll('[data-theme-opt]').forEach(b => b.addEventListener('click', () => {\n    settings.theme = b.dataset.themeOpt;\n    saveSettings();\n    applyTheme();\n  }));\n\n  $('statsSeg').addEventListener('click', e => {\n    const b = e.target.closest('[data-stats-level]');\n    if (b) { statsLevel = b.dataset.statsLevel; renderStats(); }\n  });\n  const resetBtn = $('btnResetStats');\n  resetBtn.addEventListener('click', () => {\n    if (resetBtn.dataset.armed !== '1') {\n      resetBtn.dataset.armed = '1';\n      resetBtn.textContent = 'Tap again to erase all statistics';\n      setTimeout(() => { resetBtn.dataset.armed = ''; resetBtn.textContent = 'Reset statistics'; }, 3500);\n      return;\n    }\n    for (const k in stats) stats[k] = blankStat();\n    saveStats();\n    resetBtn.dataset.armed = '';\n    resetBtn.textContent = 'Reset statistics';\n    renderStats();\n    toast('Statistics erased');\n  });\n\n  dlgEnd.addEventListener('click', e => {\n    const b = e.target.closest('[data-act]');\n    if (!b) return;\n    const act = b.dataset.act;\n    dlgEnd.close();\n    if (act === 'again') newGame(S.difficulty);\n    else if (act === 'levels' || act === 'new') openNewDialog();\n    else if (act === 'retry') restartGame();\n    else if (act === 'reveal') { ui.reveal = true; clearCoach(); resetCellCache(); render(); }\n  });\n\n  document.querySelectorAll('dialog').forEach(d => {\n    d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });\n  });\n\n  document.addEventListener('keydown', e => {\n    if (anyDialogOpen() || e.defaultPrevented) return;\n    const t = e.target;\n    if (t && t.closest && t.closest('input, textarea, select, [contenteditable=\"true\"]')) return;\n    const k = e.key;\n    if (e.ctrlKey || e.metaKey) {\n      if (k === 'z' || k === 'Z') { e.preventDefault(); undo(); }\n      return;\n    }\n    if (e.altKey) return;\n    const code = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');\n    if (code && e.shiftKey) { e.preventDefault(); enterDigit(+code[1], true); return; }\n    if (/^[1-9]$/.test(k)) { e.preventDefault(); enterDigit(+k); return; }\n    switch (k cher: back returns to the library; theme and pause come from the launcher */\nif (window.self !== window.top) {\n  const backLink = document.querySelector('.icon-btn.back');\n  if (backLink) backLink.addEventListener('click', ev => { ev.preventDefault(); parent.postMessage({ mg: 'home' }, '*'); });\n}\nwindow.addEventListener('message', ev => {\n  if (ev.source !== window.parent || !ev.data || typeof ev.data !== 'object') return;\n  const d = ev.data;\n  if (d.mg === 'theme' && d.theme && d.theme !== settings.theme) { settings.theme = d.theme; store.set(KEYS.settings, settings); applyTheme(); }\n  else if (d.mg === 'pause') setPaused(true);\n  else if (d.mg === 'resume') setPaused(false);\n});\napplyTheme();\napplyPrefs();\nui.tip = pickTip();\nif (!store.get('mg:seen:sudoku')) { store.set('mg:seen:sudoku', 1); setTimeout(() => openDialog($('dlgRules')), 500); }\nconst saved = loadGame();\nif (saved && saved.status === 'playing') {\n  S = saved;\n  wrapEl.classList.remove('is-busy');\n  resetCellCache();\n  render();\n  markRecent();\n  showCoach('info', 'Welcome back', 'Your game was saved on this device, right down to the clock.', 4200);\n} else {\n  newGame(settings.level);\n}\n})();\n<\/script>\n<\/body>\n<\/html>\n"};

  for (let k = 0; k <= rows; k++) { const Y = y + k * s, t = k === 0 || k === rows || (bh && k % bh === 0); (t ? (thick += `M${x} ${Y}H${x + cols * s}`) : (thin += `M${x} ${Y}H${x + cols * s}`)); }
  return `<path class="t-thin" d="${thin}"/><path class="t-ink" d="${thick}"/>`;

    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) sol[(r + 1) * W + c + 1] = lat[r * N + c];
    const at = (r, c) => r * W + c;
    const lines = [];
    for (let k = 1; k <= N; k++) {
      lines.push({ at: at(k, 0), cells: range(N).map(c => at(k, c + 1)) });
      lines.push({ at: at(k, W - 1), cells: range(N).map(c => at(k, N - c)) });
      lines.push({ at: at(0, k), cells: range(N).map(r => at(r + 1, k)) });
      lines.push({ at: at(W - 1, k), cells: range(N).map(r => at(N - r, k)) });
    }
    for (const l of lines) { let mx = 0, v = 0; for (const i of l.cells) if (sol[i] > mx) { mx = sol[i]; v++; } l.clue = v; }

/* =============================================================================
   Generate: build, then settle the clues according to the variant's strategy
   ============================================================================= */
async function generate(vid, levelKey, onStatus) {
  const def = V[vid], L = def.levels[levelKey];

    const { spec, sol } = def.build(L);

      let s0 = makeSolver(spec);

      const order = shuffle(range(spec.sky.length));
      const keepN = Math.round(spec.sky.length * L.keep);
      let shown = spec.sky.length;
      for (const k of order) {
        if (shown <= keepN) break;
        const c = spec.sky[k].clue;
        spec.sky[k].clue = 0;
        if (settled(makeSolver(spec), givens, logicMode, max)) shown--; else spec.sky[k].clue = c;
        await breathe();
      }
      void full;
    } else {

      givens = await dig(solver, sol, L.target || 0, { max, deadline, logic: logicMode });
    }
    if (onStatus) onStatus(now() - t0);
    const check = makeSolver(spec).count(givens, 2, 400000);
    if (!unique(check) || check.first.some((v, i) => v !== sol[i])) continue;   // never ship an ambiguous puzzle
    return { spec, sol: Array.from(sol), givens: Array.from(givens), clues: givens.reduce((n, v) => n + (v ? 1 : 0), 0), fair: fair(makeSolver(spec), givens) };
  }
  throw new Error('Could not build a puzzle');
}

/* Serialisation for saved games */
function pack(spec) {
  const o = Object.assign({}, spec);
  delete o._keys;
  for (const k of ['exist', 'region', 'parity']) o[k] = Array.from(spec[k]);
  o.init = spec.init ? Array.from(spec.init) : null;
  return o;
}
function unpack(o) {
  const s = Object.assign({}, o);
  s.exist = Uint8Array.from(o.exist); s.region = Int16Array.from(o.region); s.parity = Uint8Array.from(o.parity);
  s.init = o.init ? Int32Array.from(o.init) : null;

}

MG.latinCore = { makeSolver, generate, V, pack, unpack, popcount, lowBit, bitsOf, unique, REL: { NE, NC, LT, GT, W1, B2, NK }, newSpec, addSquare };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Mind Games launcher: one page for every game. Pick a game and it opens right here. */
(function () {
'use strict';
const MG = window.MG, CAT = window.MG_CATALOG || [], CH = window.MG_CHAPTERS || [], TH = window.MG_THUMBS || {}, EMBED = window.MG_EMBED || null;
const $ = MG.$, byId = Object.fromEntries(CAT.map(g => [g.id, g])), TITLE = document.title;
let filter = 'all', query = '', current = null, cameFromLib = false;

/* --------------------------------------------------------------- progress lines */
function summary(g) {
  const st = MG.store.get('stats:' + g.id), none = { text: 'Not played yet', short: '', has: false };
  if (!st) return none;
  const lv = Object.values(st), sum = k => lv.reduce((n, s) => n + (s[k] || 0), 0);
  const won = sum('won'), lost = sum('lost'), drawn = sum('drawn'), metric = g.metric || 'time';
  if (metric === 'duel') { const p = won + lost + drawn; return p ? { text: `Won ${won} of ${p}`, short: `${won}–${lost}`, has: true } : none; }
  if (metric === 'score') { const best = Math.max(0, ...lv.map(s => s.best || 0)); return best ? { text: `Best score ${best}`, short: String(best), has: true } : none; }
  if (!won) return sum('started') ? { text: 'Started, not solved yet', short: '', has: false } : none;
  const best = Math.min(...lv.map(s => s.best).filter(Boolean));
  return metric === 'time' ? { text: `${won} solved, best ${MG.fmtTime(best)}`, short: MG.fmtTime(best), has: true }
    : { text: `${won} solved, best ${best} moves`, short: `${best} mv`, has: true };
}

/* --------------------------------------------------------------- library and sidebar */
const matches = g => {
  if (!query) return true;
  const hay = (g.name + ' ' + g.blurb + ' ' + (g.tags || '') + ' ' + (CH.find(c => c.id === g.chapter) || {}).name).toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
};
function tile(g) {
  const p = summary(g), art = (TH[g.id] || TH._fallback)(g);
  return `<a class="tile" href="${g.path}" data-open="${g.id}" data-chapter="${g.chapter}"><div class="thumb">${art}</div>
    <div class="tile-b"><span class="tile-n">${MG.esc(g.name)}</span><span class="tile-d">${MG.esc(g.blurb)}</span>
    <span class="tile-s${p.has ? ' has' : ''}">${p.text}</span></div></a>`;
}
function renderLibrary() {
  let html = '', shown = 0;
  for (const c of CH) {
    if (filter !== 'all' && filter !== c.id) continue;
    const games = CAT.filter(g => g.chapter === c.id && matches(g));
    if (!games.length) continue;
    shown += games.length;
    html += `<section class="chapter" id="ch-${c.id}" data-chapter="${c.id}"><div class="chapter-h"><h2>${c.name}</h2><p>${c.blurb}</p></div>
      <div class="tiles">${games.map(tile).join('')}</div></section>`;
  }
  $('library').innerHTML = shown ? html : `<p class="empty">No game matches “${MG.esc(query)}”. Try a rule or a shape, like “cage”, “dots” or “16x16”.</p>`;
}
function renderChips() {
  const counts = Object.fromEntries(CH.map(c => [c.id, CAT.filter(g => g.chapter === c.id).length]));
  $('chips').innerHTML = `<button type="button" class="chip" data-c="all" aria-pressed="${filter === 'all'}">All games <small>${CAT.length}</small></button>` +
    CH.filter(c => counts[c.id]).map(c => `<button type="button" class="chip" data-c="${c.id}" data-chapter="${c.id}" aria-pressed="${filter === c.id}">${c.name} <small>${counts[c.id]}</small></button>`).join('');
}
function renderSide() {
  let h = '';
  for (const c of CH) {
    const games = CAT.filter(g => g.chapter === c.id && matches(g));
    if (!games.length) continue;
    h += `<p class="side-h" data-chapter="${c.id}">${c.name}<small>${games.length}</small></p>` + games.map(g => {
      const s = summary(g);
      return `<a class="side-g" href="${g.path}" data-open="${g.id}" data-chapter="${g.chapter}"${g.id === current ? ' aria-current="page"' : ''}><span>${MG.esc(g.name)}</span>${s.short ? `<small>${s.short}</small>` : ''}</a>`;
    }).join('');
  }
  $('sideList').innerHTML = h || '<p class="side-empty">No game matches. Try another word.</p>';
}
function markSide() { MG.qsa('.side-g').forEach(a => { if (a.dataset.open === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
function renderRecent() {
  const list = (MG.store.get('recent') || []).filter(id => byId[id]).slice(0, 5), box = $('recent');
  box.hidden = !list.length;
  if (list.length) box.innerHTML = '<b>Jump back in</b>' + list.map(id => `<a href="${byId[id].path}" data-open="${id}" data-chapter="${byId[id].chapter}">${MG.esc(byId[id].name)}</a>`).join('');
  const cont = $('btnContinue');
  if (list.length) { cont.hidden = false; cont.href = byId[list[0]].path; cont.dataset.open = list[0]; cont.querySelector('span').textContent = 'Continue ' + byId[list[0]].name; }
}

/* --------------------------------------------------------------- games open in place
   Each game runs in its own frame, so games never interfere with each other. The last few
   stay loaded (paused) for instant switching. */
const pool = [], MAX_LIVE = 4;
const post = (f, msg) => { try { f.frame.contentWindow.postMessage(msg, '*'); } catch (e) { /* frame gone */ } };
function pageHTML(id) {
  const E = EMBED, p = E.pages[id], esc = s => s.replace(/<\/script/gi, '<\\/script');
  if (!p) return E.classic.replace('<style>', '<style>\n' + E.fontFace + '\n');
  return '<!doctype html><html lang="en" data-root=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>' + p.title + '</title>' +
    '<style>' + E.fontFace + '</style>' + p.css.map(k => '<style>' + E.assets[k] + '</style>').join('') + '</head><body>' +
    p.js.map(k => '<script>' + esc(E.assets[k]) + '<\/script>').join('') + (p.boot ? '<script>' + p.boot + '<\/script>' : '') + '</body></html>';
}
function show(id) {
  const g = byId[id];
  if (!g) return showLibrary();
  document.body.classList.add('in-game');
  $('stage').hidden = false;
  let f = pool.find(p => p.id === id), fresh = false;
  if (!f) {
    if (pool.length >= MAX_LIVE) { const old = pool.filter(p => p.id !== current).sort((a, b) => a.last - b.last)[0]; if (old) { old.frame.remove(); pool.splice(pool.indexOf(old), 1); } }
    f = { id, frame: MG.h('iframe', { title: g.name }), last: 0 };
    $('frames').appendChild(f.frame); pool.push(f); fresh = true;
  }
  f.last = performance.now();
  pool.forEach(p => { if (p !== f && !p.frame.hidden) post(p, { mg: 'pause' }); p.frame.hidden = p !== f; });
  current = id;
  document.title = `${g.name} | Mind Games`;
  markSide();
  const busy = $('frameBusy');
  if (fresh) {
    busy.hidden = false;
    f.frame.addEventListener('load', () => { busy.hidden = true; post(f, { mg: 'theme', theme: MG.prefs.theme }); if (current === id) focusFrame(f); }, { once: true });
    if (EMBED) f.frame.srcdoc = pageHTML(id); else f.frame.src = g.path;
  } else { busy.hidden = true; post(f, { mg: 'resume' }); focusFrame(f); }
  MG.recent(id);
}
function focusFrame(f) { try { f.frame.contentWindow.focus(); } catch (e) { f.frame.focus(); } }
function showLibrary() {
  pool.forEach(p => { if (!p.frame.hidden) post(p, { mg: 'pause' }); p.frame.hidden = true; });
  current = null;
  $('stage').hidden = true; $('frameBusy').hidden = true;
  document.body.classList.remove('in-game');
  document.title = TITLE;
  renderLibrary(); renderSide(); renderRecent();
}
const idFromHash = () => { const m = /^#\/([\w-]+)/.exec(location.hash); return m && byId[m[1]] ? m[1] : null; };
function go(id) {
  if (!byId[id]) return;
  if (current) history.replaceState({ g: id }, '', '#/' + id);
  else { history.pushState({ g: id }, '', '#/' + id); cameFromLib = true; }
  show(id);
}
function home() {
  if (!current) return;
  if (cameFromLib) { cameFromLib = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search); showLibrary(); }
}
function route() { const id = idFromHash(); if (id) { if (id !== current) show(id); } else if (current) showLibrary(); }
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
window.addEventListener('message', e => {
  const f = pool.find(p => p.frame.contentWindow === e.source);
  if (!f || !e.data || typeof e.data !== 'object') return;
  if (e.data.mg === 'home') home();
  else if (e.data.mg === 'theme' && e.data.theme && e.data.theme !== MG.prefs.theme) { MG.prefs.theme = e.data.theme; MG.savePrefs(); MG.applyTheme(); }
});

/* --------------------------------------------------------------- hero: a 6×6 sudoku solving itself */
function demo() {
  const board = $('demoBoard'), cells = [];
  for (let i = 0; i < 36; i++) {
    const r = (i / 6) | 0, c = i % 6;
    const el = MG.h('div', { class: 'cell' + (c === 2 ? ' br' : '') + (r === 1 || r === 3 ? ' bb' : ''), html: '<span class="fx"></span><span class="v"></span>' });
    board.appendChild(el); cells.push({ el, fx: el.children[0], v: el.children[1] });
  }
  const core = MG.latinCore;
  const P = MG.range(36).map(i => { const r = (i / 6) | 0, c = i % 6, b = ((r / 2) | 0) * 2 + ((c / 3) | 0), out = []; for (let j = 0; j < 36; j++) { const r2 = (j / 6) | 0, c2 = j % 6; if (j !== i && (r2 === r || c2 === c || ((r2 / 2) | 0) * 2 + ((c2 / 3) | 0) === b)) out.push(j); } return out; });
  const units = [...MG.range(6).map(r => MG.range(6).map(c => r * 6 + c)), ...MG.range(6).map(c => MG.range(6).map(r => r * 6 + c)),
    ...MG.range(6).map(b => MG.range(6).map(k => (((b / 2) | 0) * 2 + ((k / 3) | 0)) * 6 + (b % 2) * 3 + (k % 3)))];
  const showGrid = (g, given) => cells.forEach((c, i) => { c.v.textContent = g[i] || ''; c.el.className = c.el.className.replace(/ (given|user|now)/g, '') + (g[i] ? (given[i] ? ' given' : ' user') : ''); });
  const idle = async () => { while (document.body.classList.contains('in-game') || document.hidden) await MG.sleep(500); };
  async function run() {
    let r;
    try { r = await core.generate('mini', 'easy'); } catch (e) { return; }
    const sol = r.sol, g = r.givens.slice(), given = r.givens.map(v => !!v);
    board.classList.remove('fade');
    showGrid(g, given);
    if (MG.reduced()) { showGrid(sol, given); return; }
    await MG.sleep(900);
    while (g.some(v => !v)) {
      await idle();
      let best = -1, bn = 9;
      for (let i = 0; i < 36; i++) if (!g[i]) { const used = new Set(P[i].map(j => g[j]).filter(Boolean)); const n = 6 - used.size; if (n < bn) { bn = n; best = i; } }
      g[best] = sol[best];
      const c = cells[best];
      c.el.classList.add('now'); await MG.sleep(260);
      c.v.textContent = g[best]; c.el.classList.remove('now'); c.el.classList.add('user'); MG.replay(c.v, 'ink', 300);
      for (const u of units) if (u.includes(best) && u.every(k => g[k])) u.forEach((k, n) => { cells[k].fx.style.setProperty('--d', n * 40 + 'ms'); MG.replay(cells[k].fx, 'sweep', 1100 + n * 40); });
      await MG.sleep(380);
    }
    await MG.sleep(2600); board.classList.add('fade'); await MG.sleep(600);
    run();
  }
  run();
}

/* --------------------------------------------------------------- wiring */
function init() {
  const nGames = CAT.length, nSudoku = CAT.filter(g => g.chapter === 'sudoku').length;
  $('heroSub').textContent = `${nGames} mind games in one place: Sudoku in ${nSudoku} variants, number and logic puzzles, duels against the computer, brain drills and word games. Pick one and it opens right here. Puzzles are generated in your browser, and those with a single answer are checked to have exactly one.`;
  renderChips(); renderLibrary(); renderSide(); renderRecent();
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-open]');
    if (a) { if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; e.preventDefault(); go(a.dataset.open); return; }
    if (e.target.closest('[data-home]')) { e.preventDefault(); if (current) home(); else window.scrollTo({ top: 0, behavior: MG.reduced() ? 'auto' : 'smooth' }); return; }
    if (e.target.closest('[data-random]')) { const pool2 = CAT.filter(g => g.id !== current); go(MG.pick(pool2).id); return; }
    if (e.target.closest('[data-theme-toggle]')) { MG.setTheme(MG.isDark() ? 'light' : 'dark'); }
  });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.c; renderChips(); renderLibrary();
    const top = $('chips').getBoundingClientRect().top + window.scrollY - 4;
    if (window.scrollY > top) window.scrollTo({ top, behavior: MG.reduced() ? 'auto' : 'smooth' });
  });
  const inputs = MG.qsa('[data-q]');
  inputs.forEach(q => q.addEventListener('input', () => {
    query = q.value.trim().toLowerCase();
    inputs.forEach(o => { if (o !== q) o.value = q.value; });
    renderLibrary(); renderSide();
  }));
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !MG.typing(e)) { e.preventDefault(); const vis = inputs.find(q => q.offsetParent); if (vis) vis.focus(); }
    else if (e.key === 'Escape' && MG.typing(e) && e.target.matches('[data-q]')) { inputs.forEach(q => { q.value = ''; }); query = ''; renderLibrary(); renderSide(); e.target.blur(); }
  });
  const syncTheme = () => {
    MG.qsa('[data-theme-icon]').forEach(u => u.setAttribute('href', MG.isDark() ? '#i-sun' : '#i-moon'));
    MG.qsa('[data-theme-toggle]').forEach(b => b.setAttribute('aria-label', MG.isDark() ? 'Switch to light theme' : 'Switch to dark theme'));
    pool.forEach(p => post(p, { mg: 'theme', theme: MG.prefs.theme }));
  };
  document.addEventListener('mg:theme', syncTheme); syncTheme();
  window.addEventListener('pageshow', () => { if (!current) { renderLibrary(); renderSide(); renderRecent(); } });
  const first = idFromHash();
  if (first) show(first);
  demo();
}
MG.launcher = { go, home, get current() { return current; }, pool };
init();
})();

</script>
